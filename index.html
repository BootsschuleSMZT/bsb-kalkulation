    b.addEventListener('click', function(){
      var id = b.getAttribute('data-del-ruecklage');
      state.ruecklagen = state.ruecklagen.filter(function(r){return r.id!==id;});
      persistAndRefresh('Rücklage gelöscht.');
    });
  });
}

function renderFixkostenTable(){
  var rows = state.fixkosten.slice().sort(function(a,b){return (a.bezeichnung||'').localeCompare(b.bezeichnung||'');});
  var tbody = document.querySelector('#tbl-fixkosten tbody');
  var nowKey = todayISO().slice(0,7);
  var monthSel = document.getElementById('fix-abbuch-monat');
  var viewKey = (monthSel && monthSel.value) ? monthSel.value : nowKey;
  var thAbbuch = document.getElementById('th-fix-abbuch');
  if (thAbbuch) thAbbuch.textContent = 'Abbuchung ' + monthLabelDE(viewKey);
  var sumAktiv = rows.filter(function(fk){return fixkostenActiveInMonth(fk, nowKey);}).reduce(function(s,fk){return s+(Number(fk.betrag)||0);},0);
  document.getElementById('fix-summe').textContent = eur(sumAktiv);
  var sumAusgeschlossen = rows.filter(function(fk){return fixkostenActiveInMonth(fk, nowKey) && !fixkostenCountsInMonth(fk, nowKey);}).reduce(function(s,fk){return s+(Number(fk.betrag)||0);},0);
  var hinweisEl = document.getElementById('fix-summe-hinweis');
  if (hinweisEl){
    hinweisEl.textContent = sumAusgeschlossen>0 ?
      ('Davon '+eur(sumAusgeschlossen)+' bereits über bestätigte Abbuchung(en) diesen Monat als echte Ausgabe verbucht – zählt in Kosten/Liquidität nur einmal, nicht zusätzlich.') :
      '';
  }
  if (rows.length===0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">Noch keine Fixkosten hinterlegt.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(fk){
    var aktiv = fixkostenActiveInMonth(fk, nowKey);
    var info = fixkostenAbgebuchtInfo(fk, viewKey);
    var abbuchZelle;
    if (info.abgebucht && info.auto){
      abbuchZelle = '<span class="badge" style="background:var(--good-bg);color:var(--good);" title="Automatisch erkannt über verknüpfte Ausgabe">✓ '+deDate(info.datum)+' (Ausgabe)</span>';
    } else if (info.abgebucht){
      abbuchZelle = '<span class="badge" style="background:var(--good-bg);color:var(--good);">✓ '+deDate(info.datum)+'</span>'+
        (readOnly?'':' <button class="del-btn" data-unconfirm-fix="'+fk.id+'" title="Zurücksetzen">✕</button>');
    } else if (readOnly){
      abbuchZelle = '<span class="badge" style="background:var(--surface-2);color:var(--ink-dim);">offen</span>';
    } else {
      abbuchZelle = '<span class="badge" style="background:var(--surface-2);color:var(--ink-dim);">offen</span> '+
        '<input type="date" class="fix-abbuch-date" data-fixid="'+fk.id+'" value="" placeholder="Datum" style="width:100px;">'+
        '<button class="btn-mini" data-confirm-fix="'+fk.id+'" title="Als abgebucht markieren">✓</button>';
    }
    var kategorieCell = readOnly ? escapeHtml(fk.kategorie) :
      '<select class="inline-edit select-narrow" data-editid="'+fk.id+'" data-field="kategorie" title="'+escapeHtml(fk.kategorie)+'">'+optionListWithCustom(state.kostenkategorien, fk.kategorie)+'</select>';
    var satzCell = readOnly ? (ustSatzOf(fk)+' %') : ustInlineSelect(fk.id, 'ustSatz', ustSatzOf(fk));
    return '<tr style="'+(aktiv?'':'opacity:.5;')+'"><td class="wrap">'+escapeHtml(fk.bezeichnung)+(aktiv?'':' <span style="font-size:11px;">(inaktiv)</span>')+'</td>'+
      '<td>'+kategorieCell+'</td><td>'+escapeHtml(fk.standort)+'</td><td class="num">'+eur(fk.betrag)+'</td>'+
      '<td class="num">'+satzCell+'</td>'+
      '<td class="num">'+(fk.abbuchungstag?('am '+fk.abbuchungstag+'.'):'–')+'</td>'+
      '<td class="num">'+(fk.ab||'–')+'</td><td class="num">'+(fk.bis||'laufend')+'</td>'+
      '<td class="nowrap">'+abbuchZelle+'</td>'+
      '<td>'+(readOnly?'':'<button class="del-btn" data-del-fix="'+fk.id+'" title="Löschen">✕</button>')+'</td></tr>';
  }).join('');
  tbody.querySelectorAll('.inline-edit').forEach(function(sel){
    sel.addEventListener('change', function(){
      var id = sel.getAttribute('data-editid');
      var field = sel.getAttribute('data-field');
      var fk = state.fixkosten.filter(function(x){return x.id===id;})[0];
      if (fk){ fk[field] = (field==='ustSatz') ? Number(sel.value) : sel.value; persistAndRefresh('Gespeichert.'); }
    });
  });
  tbody.querySelectorAll('[data-del-fix]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-del-fix');
      state.fixkosten = state.fixkosten.filter(function(fk){return fk.id!==id;});
      persistAndRefresh('Fixkosten-Position gelöscht.');
    });
  });
  tbody.querySelectorAll('[data-confirm-fix]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-confirm-fix');
      var input = tbody.querySelector('.fix-abbuch-date[data-fixid="'+id+'"]');
      var datum = (input && input.value) ? input.value : todayISO();
      var fk = state.fixkosten.filter(function(f){return f.id===id;})[0];
      if (fk){
        fk.abbuchungen = fk.abbuchungen || {};
        fk.abbuchungen[viewKey] = datum;
        persistAndRefresh('Abbuchung erfasst.');
      }
    });
  });
  tbody.querySelectorAll('[data-unconfirm-fix]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-unconfirm-fix');
      var fk = state.fixkosten.filter(function(f){return f.id===id;})[0];
      if (fk && fk.abbuchungen){
        delete fk.abbuchungen[viewKey];
        persistAndRefresh('Zurückgesetzt.');
      }
    });
  });
}

/* ============================= RENDER: MINIJOBBER ============================= */
function renderMinijobber(){
  var html = '<div class="pagehead"><h1>Minijobber</h1><p>Geleistete Stunden erfassen – fließt automatisch als Kosten in die Abrechnung ein</p></div>';

  html += '<div class="card settings-block"><h3>Minijobber verwalten</h3>'+
    '<div class="desc">Name und aktueller Stundenlohn – dient als Vorschlag bei der Stundenerfassung.</div>'+
    '<div class="taglist" id="tags-minijobber"></div>'+
    (readOnly?'':'<form id="form-minijobber" class="form-row" style="margin-top:12px; margin-bottom:0;">'+
      '<div class="field grow"><input type="text" name="name" placeholder="Name" required></div>'+
      '<div class="field"><input class="num-input" type="number" min="0" step="0.01" name="stundenlohn" placeholder="€ / Std." required></div>'+
      '<button class="btn ghost small" type="submit">Hinzufügen</button></form>')+
    '</div>';

  if (!readOnly){
    if (state.minijobber.length===0){
      html += '<div class="banner" style="border-color:var(--line); border-left-color:var(--brass);"><span class="ic" style="color:var(--brass);">ℹ</span>'+
        '<div>Lege zuerst oben mindestens einen Minijobber an, um Stunden erfassen zu können.</div></div>';
    } else {
      html += '<div class="card"><h2>Stunden erfassen</h2>'+
        '<form id="form-stunden" class="form-row">'+
        '<div class="field"><label>Datum</label><input type="date" name="datum" value="'+todayISO()+'" required></div>'+
        '<div class="field grow"><label>Minijobber</label><select name="minijobberId" id="stunden-minijobber-select">'+
          state.minijobber.map(function(mj){return '<option value="'+mj.id+'" data-lohn="'+mj.stundenlohn+'">'+escapeHtml(mj.name)+'</option>';}).join('')+
        '</select></div>'+
        '<div class="field"><label>Stunden</label><input class="num-input" type="number" min="0" step="0.25" name="stunden" id="stunden-input" required></div>'+
        '<div class="field"><label>Stundenlohn (€)</label><input class="num-input" type="number" min="0" step="0.01" name="stundenlohn" id="stunden-lohn-input" required></div>'+
        '<div class="field grow"><label>Notiz (optional)</label><input type="text" name="notiz" placeholder="z. B. Kursabend SBF"></div>'+
        '<button class="btn" type="submit">Eintragen</button>'+
        '</form>'+
        '<div class="cardsub" style="margin-top:10px;">Der Betrag wird automatisch als Ausgabe (Kategorie „Personal/Ausbilder") in der Abrechnung berücksichtigt.</div>'+
        '</div>';
    }
  }

  var todayPeriod = periodInfo(todayISO());
  html += '<div class="card"><h2>Abrechnung für Steuerbüro</h2>'+
    '<div class="cardsub">Aktueller Abrechnungszeitraum: '+todayPeriod.label+' · Stichtag ist immer der 15. eines Monats – Stunden ab dem 16. zählen bereits zur nächsten Abrechnung.</div>'+
    '<div id="minijobber-abrechnung"></div></div>';

  html += '<div class="card"><div class="toolbar"><h2 style="margin:0;">Erfasste Stunden</h2>'+
    '<div class="field" style="min-width:220px;"><select id="filter-stunden-periode"></select></div></div>'+
    '<div class="table-wrap"><table id="tbl-stunden">'+
    '<thead><tr><th>Datum</th><th>Minijobber</th><th class="num">Stunden</th><th class="num">Stundenlohn</th><th class="num">Betrag</th><th>Abrechnungszeitraum</th><th>Notiz</th><th></th></tr></thead>'+
    '<tbody></tbody></table></div></div>';

  html += '<div class="card"><h2>Lohnsumme '+currentYear()+' je Minijobber</h2><div id="minijobber-chart"></div></div>';

  document.getElementById('panel-minijobber').innerHTML = html;

  renderTagList('tags-minijobber', state.minijobber, function(mj){return mj.name+' <span class="price">'+eur(mj.stundenlohn)+' / Std.</span>';}, function(idx){ removeMinijobber(idx); });

  renderMinijobberAbrechnung(todayPeriod);
  fillPeriodFilter('filter-stunden-periode', state.stunden.map(function(s){return s.datum;}));
  renderStundenTable();

  var chartRows = state.minijobber.map(function(mj){
    var summe = state.stunden.filter(function(s){return s.minijobberId===mj.id && Number(monthKey(s.datum).slice(0,4))===currentYear();}).reduce(function(sum,s){return sum+(Number(s.betrag)||0);},0);
    return {name: mj.name, summe: summe};
  });
  document.getElementById('minijobber-chart').innerHTML = hbarChart(chartRows, function(r){return r.name;}, function(r){return r.summe;}, eur);

  if (!readOnly){
    document.getElementById('form-minijobber').addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(ev.target);
      var name = fd.get('name').trim();
      var lohn = Number(fd.get('stundenlohn'))||0;
      if (name){ state.minijobber.push({id: uid(), name: name, stundenlohn: lohn}); persistAndRefresh('Minijobber hinzugefügt.'); }
      ev.target.reset();
    });
    var formStunden = document.getElementById('form-stunden');
    if (formStunden){
      var selMj = document.getElementById('stunden-minijobber-select');
      var lohnInput = document.getElementById('stunden-lohn-input');
      function syncLohn(){
        var opt = selMj.options[selMj.selectedIndex];
        if (opt) lohnInput.value = opt.getAttribute('data-lohn');
      }
      selMj.addEventListener('change', syncLohn);
      syncLohn();
      formStunden.addEventListener('submit', function(ev){
        ev.preventDefault();
        var fd = new FormData(ev.target);
        var mjId = fd.get('minijobberId');
        var mj = state.minijobber.filter(function(m){return m.id===mjId;})[0];
        var stunden = Number(fd.get('stunden'))||0;
        var lohn = Number(fd.get('stundenlohn'))||0;
        var betrag = Math.round(stunden*lohn*100)/100;
        var datum = fd.get('datum');
        var notiz = fd.get('notiz')||'';
        var ausgabeId = uid();
        state.ausgaben.push({
          id: ausgabeId, datum: datum, kategorie: 'Personal/Ausbilder', standort: 'Allgemein',
          betrag: betrag, ustSatz: 0,
          notiz: 'Minijob: '+(mj?mj.name:'')+' – '+stunden+' Std. à '+eur(lohn)+'/Std.'+(notiz?' ('+notiz+')':'')
        });
        state.stunden.push({
          id: uid(), datum: datum, minijobberId: mjId, minijobberName: mj?mj.name:'', stunden: stunden,
          stundenlohn: lohn, betrag: betrag, notiz: notiz, ausgabeId: ausgabeId
        });
        persistAndRefresh('Stunden erfasst und als Ausgabe verbucht.');
        ev.target.reset();
        document.querySelector('#form-stunden input[name=datum]').value = todayISO();
        syncLohn();
      });
    }
  }
  document.getElementById('filter-stunden-periode').addEventListener('change', function(){ rememberFilter('filter-stunden-periode'); renderStundenTable(); });
}

function renderMinijobberAbrechnung(period){
  var rows = state.minijobber.map(function(mj){
    var entries = state.stunden.filter(function(s){ return s.minijobberId===mj.id && periodInfo(s.datum).key===period.key; });
    return {
      name: mj.name,
      anzahl: entries.length,
      stunden: entries.reduce(function(a,s){return a+(Number(s.stunden)||0);},0),
      betrag: entries.reduce(function(a,s){return a+(Number(s.betrag)||0);},0)
    };
  }).filter(function(r){return r.anzahl>0;});

  var el = document.getElementById('minijobber-abrechnung');
  if (!el) return;
  if (rows.length===0){
    el.innerHTML = '<p style="color:var(--ink-dim); font-size:13px; margin:0;">Für diesen Zeitraum sind noch keine Stunden erfasst.</p>';
    return;
  }
  var sumStunden = rows.reduce(function(a,r){return a+r.stunden;},0);
  var sumBetrag = rows.reduce(function(a,r){return a+r.betrag;},0);
  el.innerHTML = '<div class="table-wrap"><table>'+
    '<thead><tr><th>Minijobber</th><th class="num">Stunden</th><th class="num">Betrag</th></tr></thead>'+
    '<tbody>'+rows.map(function(r){
      return '<tr><td>'+escapeHtml(r.name)+'</td><td class="num">'+r.stunden+'</td><td class="num">'+eur(r.betrag)+'</td></tr>';
    }).join('')+
    '<tr style="font-weight:700;"><td>Summe</td><td class="num">'+sumStunden+'</td><td class="num">'+eur(sumBetrag)+'</td></tr>'+
    '</tbody></table></div>';
}

function renderStundenTable(){
  var filter = document.getElementById('filter-stunden-periode').value;
  var rows = state.stunden.slice().sort(function(a,b){return b.datum.localeCompare(a.datum);});
  if (filter && filter!=='alle') rows = rows.filter(function(s){return periodInfo(s.datum).key===filter;});
  var tbody = document.querySelector('#tbl-stunden tbody');
  if (rows.length===0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Noch keine Stunden erfasst.</td></tr>';
    return;
  }
  var todayKey = periodInfo(todayISO()).key;
  tbody.innerHTML = rows.map(function(s){
    var p = periodInfo(s.datum);
    var zeitraumCell = p.shortLabel + (p.key===todayKey ? ' <span style="color:var(--brass); font-weight:600;">(aktuell)</span>' : '');
    return '<tr><td class="num">'+s.datum+'</td><td>'+escapeHtml(s.minijobberName)+'</td>'+
      '<td class="num">'+s.stunden+'</td><td class="num">'+eur(s.stundenlohn)+'</td><td class="num">'+eur(s.betrag)+'</td>'+
      '<td>'+zeitraumCell+'</td>'+
      '<td class="wrap">'+escapeHtml(s.notiz)+'</td>'+
      '<td>'+(readOnly?'':'<button class="del-btn" data-del-stunden="'+s.id+'" title="Löschen">✕</button>')+'</td></tr>';
  }).join('');
  tbody.querySelectorAll('[data-del-stunden]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-del-stunden');
      var entry = state.stunden.filter(function(s){return s.id===id;})[0];
      state.stunden = state.stunden.filter(function(s){return s.id!==id;});
      if (entry && entry.ausgabeId){ state.ausgaben = state.ausgaben.filter(function(a){return a.id!==entry.ausgabeId;}); }
      persistAndRefresh('Stunden-Eintrag (inkl. verknüpfter Ausgabe) gelöscht.');
    });
  });
}
function removeMinijobber(i){ state.minijobber.splice(i,1); persistAndRefresh('Minijobber entfernt.'); }

  html += '<div class="banner" style="border-color:var(--line); border-left-color:var(--petrol);"><span class="ic" style="color:var(--petrol);">ℹ</span>'+
    '<div>Diese Übersicht wird automatisch aus den hinterlegten MwSt-Sätzen bei Einnahmen, Ausgaben und Fixkosten berechnet. Sie ist eine Kalkulationshilfe für dich – die verbindliche USt-Voranmeldung macht weiterhin dein Steuerberater.</div></div>';

  html += '<div class="kpi-row">'+
    '<div class="kpi"><div class="label">Umsatzsteuer · laufender Monat</div><div class="value">'+eur(m.curUstRow.ust)+'</div><div class="sub">aus Einnahmen</div></div>'+
    '<div class="kpi"><div class="label">Vorsteuer · laufender Monat</div><div class="value">'+eur(m.curUstRow.vorsteuer)+'</div><div class="sub">aus Ausgaben + Fixkosten</div></div>'+
    '<div class="kpi '+(m.curUstRow.zahllast>=0?'bad':'good')+'"><div class="label">'+(m.curUstRow.zahllast>=0?'USt-Zahllast':'Vorsteuer-Überhang')+'</div><div class="value">'+eur(Math.abs(m.curUstRow.zahllast))+'</div><div class="sub">'+(m.curUstRow.zahllast>=0?'an das Finanzamt':'Erstattung möglich')+'</div></div>'+
    '<div class="kpi '+(m.ytdZahllast>=0?'bad':'good')+'"><div class="label">Saldo '+m.year+' (YTD)</div><div class="value">'+eur(Math.abs(m.ytdZahllast))+'</div><div class="sub">USt '+eur(m.ytdUst)+' ./. Vorsteuer '+eur(m.ytdVorsteuer)+'</div></div>'+
    '<div class="kpi '+(m.ustOffenSumme>0?'bad':'good')+'"><div class="label">Noch offen (nicht bestätigt)</div><div class="value">'+eur(Math.abs(m.ustOffenSumme))+'</div><div class="sub">'+(m.ustOffenSumme>0?'noch an das Finanzamt zu zahlen':(m.ustOffenSumme<0?'Guthaben, noch offen':'alles erledigt'))+'</div></div>'+
    '</div>';

  html += '<div class="banner" style="border-color:var(--line); border-left-color:var(--brass);"><span class="ic" style="color:var(--brass-ink);">✓</span>'+
    '<div>Markiere je Monat, sobald die USt-Zahlung ans Finanzamt tatsächlich erfolgt ist – egal ob du (wie aktuell) quartalsweise oder (ab nächstem Jahr) monatlich meldest: bei quartalsweiser Meldung einfach die passenden Monate im jeweiligen Quartal einzeln bestätigen, sobald die Zahlung raus ist. Nicht bestätigte Monate zählen oben als „Noch abzuführende USt" und werden von „Wirklich frei verfügbar" auf der Übersichtsseite abgezogen.</div></div>';

  html += '<div class="card"><h2>Monatliche USt-Voranmeldung · '+m.year+'</h2><div class="cardsub">Netto-Beträge und Steuerbeträge je Monat</div>'+

    '<thead><tr><th>Monat</th><th class="num">Umsatzsteuer</th><th class="num">Vorsteuer</th><th class="num">Zahllast / Erstattung</th><th class="nowrap">Ans Finanzamt gezahlt</th></tr></thead>'+
    '<tbody>'+m.ustMonthly.map(function(r){
      var z = r.zahllast;
      var abZelle;
      if (r.isFuture){
        abZelle = '<span style="color:var(--ink-dim); font-size:12px;">–</span>';
      } else if (r.abgefuehrt){
        abZelle = '<span class="badge" style="background:var(--good-bg);color:var(--good);">✓ '+deDate(r.abgefuehrtDatum)+'</span>'+
          (readOnly?'':' <button class="del-btn" data-unconfirm-ust="'+r.key+'" title="Zurücksetzen">✕</button>');
      } else if (readOnly){
        abZelle = '<span class="badge" style="background:var(--surface-2);color:var(--ink-dim);">offen</span>';

      }
      var zahllastZelle = '<td class="num" style="color:'+(z>=0?'var(--bad)':'var(--good)')+'">'+(z>=0?'':'−')+eur(Math.abs(z));

        zahllastZelle += ' <span class="badge" style="background:var(--surface-2);color:var(--ink-dim);font-size:9.5px;padding:1px 6px;" title="Manuell eingetragener Betrag, überschreibt die Berechnung aus Einnahmen/Ausgaben für diesen Monat">manuell'+
          (readOnly?'':' <button class="del-btn" data-unmanual-ust="'+r.key+'" title="Korrektur zurücksetzen" style="font-size:11px;padding:0 2px;">✕</button>')+'</span>';

          ' <button class="btn-mini" data-set-manual-ust="'+r.key+'" title="Korrektur übernehmen" style="font-size:11px;">✎</button>';

    '</div>';

  document.getElementById('panel-ust').innerHTML = html;

  document.querySelectorAll('[data-confirm-ust]').forEach(function(b){
    b.addEventListener('click', function(){
      var mk = b.getAttribute('data-confirm-ust');
      var input = document.querySelector('.ust-abf-date[data-mk="'+mk+'"]');
      var datum = (input && input.value) ? input.value : todayISO();
      state.meta.ustAbgefuehrt = state.meta.ustAbgefuehrt || {};
      state.meta.ustAbgefuehrt[mk] = datum;
      persistAndRefresh('USt-Zahlung erfasst.');
    });
  });
  document.querySelectorAll('[data-unconfirm-ust]').forEach(function(b){
    b.addEventListener('click', function(){
      var mk = b.getAttribute('data-unconfirm-ust');
      if (state.meta.ustAbgefuehrt) delete state.meta.ustAbgefuehrt[mk];
      persistAndRefresh('Zurückgesetzt.');
    });
  });
  document.querySelectorAll('[data-set-manual-ust]').forEach(function(b){
    b.addEventListener('click', function(){
      var mk = b.getAttribute('data-set-manual-ust');
      var input = document.querySelector('.ust-manual-input[data-mk="'+mk+'"]');
      var val = (input && input.value !== '') ? Number(input.value) : NaN;
      if (isNaN(val)){ showToast('Bitte einen Betrag eintragen.', true); return; }
      state.meta.ustManuell = state.meta.ustManuell || {};
      state.meta.ustManuell[mk] = {betrag: val};
      persistAndRefresh('Manuelle Korrektur gespeichert.');
    });
  });
  document.querySelectorAll('[data-unmanual-ust]').forEach(function(b){
    b.addEventListener('click', function(){
      var mk = b.getAttribute('data-unmanual-ust');
      if (state.meta.ustManuell) delete state.meta.ustManuell[mk];
      persistAndRefresh('Korrektur zurückgesetzt.');
    });
  });
}

function renderTagList(containerId, items, labelFn, onRemove){
  var el = document.getElementById(containerId);
  if (items.length===0){ el.innerHTML = '<span style="color:var(--ink-dim); font-size:13px;">Noch keine Einträge.</span>'; return; }
  el.innerHTML = items.map(function(it,i){
    return '<span class="tag">'+labelFn(it)+(readOnly?'':' <button data-idx="'+i+'" title="Entfernen">✕</button>')+'</span>';
  }).join('');
  if (!readOnly){
    el.querySelectorAll('button[data-idx]').forEach(function(b){
      b.addEventListener('click', function(){ onRemove(Number(b.getAttribute('data-idx'))); });
    });
  }
}

/* ============================= PERSISTENCE ============================= */
function showToast(msg, isErr){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className=''; }, 2600);
}

var TAB_NAMES = ['dashboard','kurse','einnahmen','ausgaben','fixkosten','minijobber','ust','einstellungen'];

function shellHTML(activeTab){
  // Static app shell — sidebar nav and empty tab-panel containers.
  // Deliberately hand-written (not read from the live DOM), since the live
  // DOM's panels are re-rendered from `state` on every load and would not
  // reflect the authored shape after viewer interaction.
  // `activeTab` decides which nav button / panel starts marked "active" in
  // the freshly built document — without this, every publish() would reset
  // the viewer back to the Dashboard tab (the artifact viewer reloads the
  // whole page to the newly published HTML after every save).
  if (TAB_NAMES.indexOf(activeTab) === -1) activeTab = 'dashboard';
  function navBtn(tab, icon, label){
    return '<button data-tab="'+tab+'"'+(tab===activeTab?' class="active"':'')+'><span class="ic">'+icon+'</span> '+label+'</button>';
  }
  function panel(tab){
    return '<div id="panel-'+tab+'" class="tab-panel'+(tab===activeTab?' active':'')+'"></div>';
  }

function buildFullHTML(){
  // Rebuilds the ENTIRE page purely from `state` (plus the canonical style/
  // script text captured at load) — never from the live, possibly
  // viewer-mutated DOM. This is what gets handed to artifact.publish().
  var stateJson = JSON.stringify(state).replace(/<\//g, '<\\/');
  return '<!doctype html>\n'+
    '<html lang="de">\n'+
    '<head>\n'+
      '<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>'+PAGE_TITLE+'</title>\n'+
    '</head>\n'+
    '<body>\n'+
      '<style id="app-style">'+STYLE_CSS+'</style>\n'+
      shellHTML(currentTab)+'\n'+
      '<script id="app-state" type="application/json">'+stateJson+'<\/script>\n'+
      '<script>'+APP_SCRIPT_SRC+'<\/script>\n'+
    '</body>\n'+
    '</html>';
}

function persistAndRefresh(msg){
  renderAll();
  if (readOnly){ showToast(msg, false); return; }
  if (sheetsConnected){ saveToSheets(msg); return; }
  if (!artifactApi){ showToast(msg + ' (nur lokal – Speichern nicht verfügbar)', true); return; }
  artifactApi.publish(buildFullHTML()).then(function(){
    showToast(msg);
  }).catch(function(err){
    if (err && err.code === 'conflict') return; // view will reload to winning version
    if (err && (err.code === 'not_writer' || err.code === 'not_granted')){
      readOnly = true; renderAll();
      showToast('Nur Lesezugriff – Änderung wurde nicht gespeichert.', true);
      return;
    }
    showToast('Speichern fehlgeschlagen. Bitte kurz erneut versuchen.', true);
  });
}

renderAll();
loadFromSheets();

var sidebarBackupBtn = document.getElementById('btn-offline-backup');
if (sidebarBackupBtn) sidebarBackupBtn.addEventListener('click', downloadOfflineBackup);

if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('artifact').then(function(api){
    if (!api){ return; }
    artifactApi = api;
  }).catch(function(){});
  window.claude.use('downloads').then(function(api){
    if (!api){ return; }
    downloadsApi = api;
    var btn = document.getElementById('btn-offline-backup');
    if (btn) btn.style.display = '';
  }).catch(function(){});
}

function downloadOfflineBackup(){
  if (!downloadsApi){ showToast('Offline-Sicherung in dieser Ansicht nicht verfügbar.', true); return; }
  var filename = 'kalkulation-bootsschule-bremen-'+todayISO()+'.html';
  downloadsApi.save({filename: filename, data: buildFullHTML()}).then(function(){
    showToast('Offline-Sicherung gespeichert: '+filename);
  }).catch(function(err){
    if (err && err.code === 'declined') return;
    if (err && (err.code === 'rejected_extension' || err.code === 'extension_not_enabled')){
      var jsonName = 'kalkulation-bootsschule-bremen-'+todayISO()+'.json';
      downloadsApi.save({filename: jsonName, data: JSON.stringify(state, null, 2)}).then(function(){
        showToast('Offline-Sicherung als Datendatei gespeichert: '+jsonName+' (Format .html war hier nicht möglich).');
      }).catch(function(){
        showToast('Offline-Sicherung fehlgeschlagen.', true);
      });
      return;
    }
    if (err && err.code === 'rate_limited'){ showToast('Bitte kurz warten und erneut versuchen.', true); return; }
    showToast('Offline-Sicherung fehlgeschlagen.', true);
  });
}
