<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulation Bootsschule Bremen</title>
</head>
<body>
<style id="app-style">
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#eef1f0;
    --surface:#ffffff;
    --surface-2:#e4e9e7;
    --ink:#101c24;
    --ink-dim:#4b5c62;
    --line:#d3dbd8;
    --navy:#1d3b53;
    --navy-2:#284d6b;
    --petrol:#2f6a68;
    --brass:#b3812f;
    --brass-ink:#5e4013;
    --good:#2f7d5c;
    --good-bg:#e2f0e8;
    --bad:#af4b32;
    --bad-bg:#f5e4de;
    --warn:#c98a2c;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,28,36,.06), 0 6px 20px -8px rgba(16,28,36,.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d1519;
      --surface:#152026;
      --surface-2:#1c2930;
      --ink:#e8edec;
      --ink-dim:#9db0b3;
      --line:#2a383e;
      --navy:#5f8cae;
      --navy-2:#7ba3c2;
      --petrol:#59a39c;
      --brass:#d6a34f;
      --brass-ink:#f0d9a8;
      --good:#5cbf8f;
      --good-bg:#173327;
      --bad:#e08067;
      --bad-bg:#3a2019;
      --warn:#e0ac53;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d1519;
    --surface:#152026;
    --surface-2:#1c2930;
    --ink:#e8edec;
    --ink-dim:#9db0b3;
    --line:#2a383e;
    --navy:#5f8cae;
    --navy-2:#7ba3c2;
    --petrol:#59a39c;
    --brass:#d6a34f;
    --brass-ink:#f0d9a8;
    --good:#5cbf8f;
    --good-bg:#173327;
    --bad:#e08067;
    --bad-bg:#3a2019;
    --warn:#e0ac53;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; font-weight:600;}
  .num{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---- layout ---- */
  #sidebar{
    width:236px;
    flex:0 0 236px;
    background:var(--navy);
    color:#eef3f6;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    gap:4px;
  }
  .brand{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    padding:4px 8px 20px 8px;
    border-bottom:1px solid rgba(255,255,255,.14);
    margin-bottom:14px;
  }
  .brand img.logo{max-width:100%; width:168px; height:auto; display:block;}
  .brand .mark{font-size:22px; line-height:1;}
  .brand .name{font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; line-height:1.25;}
  .brand .sub{font-size:11px; opacity:.72; letter-spacing:.03em;}
  .brand .brand-updated{font-size:10.5px; opacity:.58; margin-top:2px;}
  nav.tabs{display:flex; flex-direction:column; gap:2px;}
  nav.tabs button{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:8px;
    font-size:14px; font-weight:500; color:#dbe6ea;
    transition:background .12s ease;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.08);}
  nav.tabs button.active{background:rgba(255,255,255,.14); color:#fff;}
  nav.tabs button .ic{font-size:15px; width:18px; text-align:center;}
  #sidebar .foot{margin-top:auto; padding-top:14px; font-size:11px; color:rgba(255,255,255,.5); line-height:1.5;}

  #main{flex:1; min-width:0; padding:30px 24px 60px; max-width:1180px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .pagehead{margin-bottom:22px;}
  .pagehead h1{font-size:26px;}
  .pagehead p{color:var(--ink-dim); font-size:14px; margin:4px 0 0;}

  .banner{
    background:var(--surface); border:1px solid var(--brass); border-left:4px solid var(--brass);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:22px; font-size:13.5px; color:var(--ink);
    display:flex; gap:10px; align-items:flex-start;
  }
  .banner .ic{color:var(--brass); font-size:16px;}
  .banner button{margin-left:auto; flex:0 0 auto;}

  /* ---- KPI cards ---- */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:26px;}
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .kpi .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); font-weight:600;}
  .kpi .value{font-size:25px; margin-top:6px; font-weight:600;}
  .kpi .sub{font-size:12px; color:var(--ink-dim); margin-top:3px;}
  .kpi.good .value{color:var(--good);}
  .kpi.bad .value{color:var(--bad);}

  /* ---- Highlight-Kachel (die eine Zahl, die zählt) ---- */
  .highlight-kpi{
    background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--ink-dim);
    border-radius:var(--radius); padding:18px 22px; margin-bottom:26px; box-shadow:var(--shadow);
    display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px;
  }
  .highlight-kpi.good{border-left-color:var(--good);}
  .highlight-kpi.bad{border-left-color:var(--bad);}
  .highlight-kpi .hk-label{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); font-weight:700; flex:1 0 100%;}
  .highlight-kpi .hk-value{font-size:32px; font-weight:700; font-family:'IBM Plex Mono', ui-monospace, monospace;}
  .highlight-kpi.good .hk-value{color:var(--good);}
  .highlight-kpi.bad .hk-value{color:var(--bad);}
  .highlight-kpi .hk-breakdown{font-size:12.5px; color:var(--ink-dim);}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .card h2{font-size:16.5px; margin-bottom:2px;}
  .card .cardsub{font-size:12.5px; color:var(--ink-dim); margin-bottom:14px;}
  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}

  .chart-wrap{overflow-x:auto;}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--ink-dim); margin-top:8px; flex-wrap:wrap;}
  .legend .sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}

  /* ---- tables ---- */
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius);}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
  th,td{text-align:left; padding:6px 5px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); font-weight:600;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; text-align:right;}
  td.wrap{white-space:normal; max-width:85px; overflow-wrap:anywhere;}
  .del-btn{all:unset; cursor:pointer; color:var(--bad); font-size:15px; padding:2px 6px; border-radius:5px;}
  .del-btn:hover{background:var(--bad-bg);}
  .empty-row td{color:var(--ink-dim); text-align:center; padding:22px; font-style:italic;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .btn-mini{all:unset; cursor:pointer; background:var(--good-bg); color:var(--good); font-size:13px; font-weight:700; padding:3px 8px; border-radius:5px; margin-left:4px;}
  .btn-mini:hover{filter:brightness(0.95);}
  td.nowrap, th.nowrap{white-space:nowrap;}
  select.inline-edit{font:inherit; color:inherit; background:transparent; border:1px solid transparent; border-radius:5px; padding:2px 4px; max-width:180px;}
  select.inline-edit:hover, select.inline-edit:focus{border-color:var(--line); background:var(--surface);}
  select.inline-edit.select-narrow{max-width:72px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  select.inline-edit.select-xnarrow{max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  input.inline-edit-input{font:inherit; color:inherit; background:transparent; border:1px solid transparent; border-radius:5px; padding:2px 4px; width:100%; box-sizing:border-box;}
  input.inline-edit-input:hover, input.inline-edit-input:focus{border-color:var(--line); background:var(--surface);}

  /* ---- forms ---- */
  .form-row{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:5px; min-width:130px;}
  .field.grow{flex:1;}
  .field label{font-size:11.5px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em;}
  input, select{
    font-family:inherit; font-size:13.5px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink);
  }
  input.num-input, select{font-variant-numeric:tabular-nums;}
  input:focus, select:focus{outline:2px solid var(--petrol); outline-offset:1px;}
  .btn{
    all:unset; cursor:pointer; background:var(--navy); color:#fff; font-weight:600;
    font-size:13.5px; padding:9px 18px; border-radius:7px; text-align:center;
  }
  .btn:hover{background:var(--navy-2);}
  .btn.ghost{background:transparent; color:var(--navy); border:1px solid var(--line);}
  :root[data-theme="dark"] .btn.ghost, :root:not([data-theme="light"]) .btn.ghost{color:var(--navy);}
  .btn.small{padding:6px 12px; font-size:12.5px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .sidebar-backup-btn{
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; box-sizing:border-box; margin:16px 0 4px; padding:13px 12px;
    background:var(--brass); color:#241a06; font-weight:700; font-size:13.5px;
    border-radius:9px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .sidebar-backup-btn:hover{background:var(--brass-ink); color:#fff;}
  .sidebar-backup-btn .ic{font-size:16px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px; flex-wrap:wrap;}

  .taglist{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .tag{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:20px; padding:5px 6px 5px 12px; font-size:13px;
  }
  .tag button{all:unset; cursor:pointer; color:var(--bad); width:18px; height:18px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
  .tag button:hover{background:var(--bad-bg);}
  .tag .price{color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:12px;}

  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:50; box-shadow:var(--shadow);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--bad);}

  .settings-block{margin-bottom:26px;}
  .settings-block h3{font-size:14.5px; margin-bottom:4px;}
  .settings-block .desc{font-size:12.5px; color:var(--ink-dim); margin-bottom:10px;}

  .readonly-note{
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 14px; font-size:13px; color:var(--ink-dim); margin-bottom:18px;
  }

  @media (max-width:880px){
    body{flex-direction:column;}
    #sidebar{width:100%; flex:none; flex-direction:row; align-items:center; overflow-x:auto;}
    nav.tabs{flex-direction:row;}
    #sidebar .foot{display:none;}
    .brand{border-bottom:none; margin-bottom:0; padding-bottom:0;}
    #main{padding:22px 18px 50px;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
  }
</style>

<script>
(function(){
"use strict";

/* Canonical source captured BEFORE any mutation happens: the style block's
   authored text and this script's own authored text. Used later to rebuild
   a complete, self-contained document from `state` alone — never by
   serializing the live (possibly viewer-mutated) DOM. */
var STYLE_CSS = document.getElementById('app-style').textContent;
var APP_SCRIPT_SRC = document.currentScript ? document.currentScript.textContent : '';
var PAGE_TITLE = 'Kalkulation Bootsschule Bremen';

/* ============================= STATE ============================= */
var state = JSON.parse(document.getElementById('app-state').textContent);
// Rückwärtskompatibel: ältere gespeicherte Versionen kennen diese Felder noch nicht.
if (!state.minijobber) state.minijobber = [];
if (!state.stunden) state.stunden = [];
if (!state.ruecklagen) state.ruecklagen = [];
var readOnly = false;
var artifactApi = null;
var downloadsApi = null;

/* ==================== GOOGLE-SHEETS-SYNC (Standalone) ====================
   Diese eigenständige Version läuft außerhalb von Claude und speichert/lädt
   den gesamten Stand über eine Google-Apps-Script-Web-App, die an ein
   Google Sheet angebunden ist. Das im HTML eingebettete <script id="app-state">
   dient hier nur noch als Startpunkt/Fallback (z. B. wenn beim allerersten
   Öffnen noch keine Internetverbindung besteht). */
var SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbw0xxDaRmItlpyQMEV1Vx3N4y-O8TnsASP7fZKb9ZM1zNfPpnVFuyHNW0dg_Zq68lDK/exec';
var sheetsConnected = SHEETS_API_URL.indexOf('PASTE_WEB_APP_URL_HERE') === -1;
var lastServerVersion = null;
var syncInFlight = false;

function backfillAfterLoad(){
  if (!state.minijobber) state.minijobber = [];
  if (!state.stunden) state.stunden = [];
  if (!state.ruecklagen) state.ruecklagen = [];
  if (!state.meta) state.meta = {};
  if (!state.meta.ustManuell) state.meta.ustManuell = {};
  if (!state.meta.ustAbgefuehrt) state.meta.ustAbgefuehrt = {};
}

function loadFromSheets(){
  if (!sheetsConnected) return;
  fetch(SHEETS_API_URL, { method: 'GET' }).then(function(r){ return r.json(); }).then(function(data){
    lastServerVersion = data.version || null;
    var serverState = data.state;
    var serverHasData = !!(serverState && ((serverState.einnahmen && serverState.einnahmen.length) || (serverState.meta && serverState.meta.startdatum)));
    if (serverHasData){
      state = serverState;
      backfillAfterLoad();
      renderAll();
      showToast('Aktueller Stand aus dem Google Sheet geladen.');
    } else {
      // Google Sheet ist noch leer — den mitgelieferten Startstand einmalig hochladen.
      saveToSheets('Startdaten ins Google Sheet übertragen ...');
    }
  }).catch(function(){
    showToast('Verbindung zum Google Sheet fehlgeschlagen — zeige zuletzt gespeicherten Stand (nicht unbedingt der neueste).', true);
  });
}

function saveToSheets(msg){
  if (!sheetsConnected){
    showToast(msg + ' (nicht mit Google Sheet verbunden — nur hier im Browser sichtbar)', true);
    return;
  }
  if (syncInFlight) return;
  syncInFlight = true;
  fetch(SHEETS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ state: state, expectedVersion: lastServerVersion })
  }).then(function(r){ return r.json(); }).then(function(res){
    syncInFlight = false;
    if (res.conflict){
      state = res.state;
      lastServerVersion = res.version;
      backfillAfterLoad();
      renderAll();
      showToast('Jemand anderes hat zwischenzeitlich gespeichert — Stand wurde aktualisiert. Bitte kurz prüfen und Eingabe ggf. erneut vornehmen.', true);
      return;
    }
    if (res.ok){
      lastServerVersion = res.version;
      showToast(msg);
    } else {
      showToast('Speichern fehlgeschlagen. Bitte kurz erneut versuchen.', true);
    }
  }).catch(function(){
    syncInFlight = false;
    showToast('Speichern fehlgeschlagen (keine Verbindung). Bitte kurz erneut versuchen.', true);
  });
}
// Which tab is currently shown — read from whatever the shell marked active
// on load, so a republish preserves the viewer's place instead of always
// reopening on Dashboard. Kept in sync by activateTab().
var currentTab = (function(){
  var activePanel = document.querySelector('.tab-panel.active');
  if (activePanel && activePanel.id.indexOf('panel-') === 0) return activePanel.id.slice('panel-'.length);
  return 'dashboard';
})();
// Remembers the last-picked value of month/period filter selects. Every
// publish() reloads the ENTIRE document to the newly saved HTML (even for
// the person who just saved), which wipes plain JS variables — so a
// filter selection kept only in memory would revert the moment any edit
// (add/delete/change) triggers the next save+reload. Storing it inside
// `state` instead means it round-trips through the same JSON that already
// survives every reload, exactly like einnahmen/ausgaben/etc. do.
if (!state.uiFilters) state.uiFilters = {};
var uiFilters = state.uiFilters;
function rememberFilter(selectId){
  var el = document.getElementById(selectId);
  if (el) uiFilters[selectId] = el.value;
}

function uid(){ return 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
// Rückwärtskompatibel: einige ältere Einträge (u. a. der ursprüngliche
// Fixkosten-Import) haben nie eine id bekommen. Ohne id funktionieren
// Löschen/Bearbeiten-Buttons nicht (data-Attribut wird "undefined") –
// hier einmalig nachgerüstet, damit jede Zeile eindeutig ansprechbar ist.
if (!state.kurse) state.kurse = [];
(function backfillIds(){
  ['fixkosten','einnahmen','ausgaben','minijobber','stunden','kurse','ruecklagen'].forEach(function(key){
    (state[key]||[]).forEach(function(item){ if (!item.id) item.id = uid(); });
  });
})();
// Rückwärtskompatibel (2026-09-02): Einnahmen ohne Kurs-Verknüpfung bekommen
// ein leeres kursId-Feld, damit das inline-edit-Dropdown im Kurse-Tab
// funktioniert (Einnahme <-> konkrete Kursdurchführung, nicht nur Kursart).
(function backfillKursId(){
  (state.einnahmen||[]).forEach(function(e){ if (e.kursId==null) e.kursId = ''; });
})();
// Rückwärtskompatibel (2026-09-02): Teilnehmerliste je Kurs (Anrede, Name,
// Kontakt, Rechnungsnr., Zahlungsstatus) – ersetzt die separate Excel-Liste.
(function backfillKursTeilnehmer(){
  (state.kurse||[]).forEach(function(k){ if (!k.teilnehmer) k.teilnehmer = []; });
})();
// Rückwärtskompatibel (2026-09-02): Zahlungsart + Abgleich-Status für
// Einnahmen/Ausgaben nachgerüstet, damit ältere Einträge nicht fehlen.
(function backfillZahlungsartAbgleich(){
  ['einnahmen','ausgaben'].forEach(function(key){
    (state[key]||[]).forEach(function(item){
      if (item.zahlungsart==null) item.zahlungsart = '';
      if (item.abgeglichen==null) item.abgeglichen = false;
    });
  });
})();
// Rückwärtskompatibel (2026-09-04): "Rechnung vorhanden?" je Einnahme – im
// Zweifelsfall wird von "nicht vorhanden" ausgegangen (false), damit nichts
// versehentlich als bereits abgerechnet gilt, was tatsächlich noch offen ist.
(function backfillRechnungVorhanden(){
  (state.einnahmen||[]).forEach(function(e){ if (e.rechnungVorhanden==null) e.rechnungVorhanden = false; });
})();
// Rückwärtskompatibel (2026-09-04): Bestätigte USt-Abführungen je Monat
// (unabhängig davon, ob quartalsweise oder monatlich an das Finanzamt
// gemeldet wird – jeder Monat kann einzeln als "abgeführt" markiert werden).
(function backfillUstAbgefuehrt(){
  if (!state.meta.ustAbgefuehrt) state.meta.ustAbgefuehrt = {};
})();
// Rückwärtskompatibel (2026-09-04): Manuelle Korrektur der USt-Zahllast je
// Monat – für Monate, in denen die automatische Berechnung aus Einnahmen/
// Ausgaben nicht zutrifft (z. B. weil für diesen Monat keine vollständigen
// Buchungen im Tool erfasst sind, der tatsächliche Betrag aber bekannt ist).
(function backfillUstManuell(){
  if (!state.meta.ustManuell) state.meta.ustManuell = {};
})();
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return d.slice(0,7); }
// Anzahl volle Tage zwischen zwei ISO-Datumsangaben (für die täglich
// anwachsende Liegeplatz-/Werft-Rücklage weiter unten).
function daysBetween(fromIso, toIso){
  var a = new Date(fromIso+'T00:00:00Z'), b = new Date(toIso+'T00:00:00Z');
  return Math.max(0, Math.round((b-a) / 86400000));
}
function eur(n){
  n = Number(n)||0;
  return n.toLocaleString('de-DE',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function eurShort(n){
  n = Number(n)||0;
  return n.toLocaleString('de-DE',{maximumFractionDigits:0}) + ' €';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var MONTH_NAMES = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function deDate(iso){
  if (!iso) return '';
  var p = iso.split('-');
  return p.length===3 ? (p[2]+'.'+p[1]+'.'+p[0]) : iso;
}
function monthLabelDE(ymKey){
  if (!ymKey) return '';
  var p = ymKey.split('-');
  return p.length===2 ? (p[1]+'/'+p[0]) : ymKey;
}

/* ============================= COMPUTE ============================= */
function currentYear(){ return new Date().getFullYear(); }

function fixkostenActiveInMonth(fk, ymKey){
  if (fk.ab && fk.ab > ymKey) return false;
  if (fk.bis && fk.bis < ymKey) return false;
  return true;
}

// Findet eine echte Ausgabe, die per Fixkosten-Zuordnung (a.fixkostenId) mit
// dieser Fixkosten-Position verknüpft ist und im gegebenen Monat liegt.
function findLinkedAusgabe(fk, ymKey){
  var found = null;
  state.ausgaben.forEach(function(a){
    if (found) return;
    if (a.fixkostenId === fk.id && monthKey(a.datum) === ymKey) found = a;
  });
  return found;
}

// Ob eine Fixkosten-Position für diesen Monat bereits "abgebucht" ist —
// entweder weil eine echte Ausgabe damit verknüpft wurde (automatisch,
// bevorzugt) oder weil die Abbuchung manuell bestätigt wurde.
function fixkostenAbgebuchtInfo(fk, ymKey){
  var linked = findLinkedAusgabe(fk, ymKey);
  if (linked) return {abgebucht:true, datum: linked.datum, auto:true, ausgabeId: linked.id};
  if (fk.abbuchungen && fk.abbuchungen[ymKey]) return {abgebucht:true, datum: fk.abbuchungen[ymKey], auto:false};
  return {abgebucht:false};
}

// Ob eine Fixkosten-Position für einen Monat in die tatsächlichen Kosten/
// Liquidität eingerechnet werden soll. Sobald die Abbuchung für diesen Monat
// bestätigt ist (grüner Haken im Fixkosten-Tab, automatisch per Verknüpfung
// oder manuell), geht man davon aus, dass dafür bereits eine echte Ausgabe
// gebucht wurde (z. B. beim Kontoauszug-Abgleich) — die automatische
// Fixkosten-Schätzung würde den Betrag dann ein zweites Mal zählen und wird
// deshalb für diesen Monat ausgesetzt.
function fixkostenCountsInMonth(fk, ymKey){
  if (!fixkostenActiveInMonth(fk, ymKey)) return false;
  if (fixkostenAbgebuchtInfo(fk, ymKey).abgebucht) return false;
  return true;
}

/* Alle Beträge im Tool werden brutto erfasst (wie auf dem Kontoauszug).
   ustSatz ist der hinterlegte MwSt-Satz (19, 7 oder 0 für steuerfrei/ohne
   Vorsteuerabzug, z. B. Gehälter, Versicherungen, Kredittilgung, Bankgebühren). */
function nettoOf(brutto, satz){
  var s = Number(satz)||0;
  return (Number(brutto)||0) / (1 + s/100);
}
function steuerOf(brutto, satz){
  return (Number(brutto)||0) - nettoOf(brutto, satz);
}
function ustSatzOf(entry){
  return entry && entry.ustSatz!=null ? Number(entry.ustSatz) : 19;
}

/* Eine Einnahme gilt als "vorausbezahlt", wenn ein Kurstermin hinterlegt ist,
   der nach heute liegt: das Geld ist schon auf dem Konto (im Kontostand
   enthalten), der Kurs (und damit die zugehörigen Kosten) finden aber erst
   künftig statt. */
function isVorausbezahlt(e){
  return !!(e.kurstermin && e.kurstermin > todayISO());
}

function computeMetrics(){
  var year = currentYear();
  var nowKey = todayISO().slice(0,7);
  var months = [];
  for (var m=1;m<=12;m++){
    var mm = (m<10?'0':'')+m;
    months.push(year+'-'+mm);
  }

  var revByMonth = {}, expByMonth = {}, fixByMonth = {};
  months.forEach(function(mk){ revByMonth[mk]=0; expByMonth[mk]=0; fixByMonth[mk]=0; });

  state.einnahmen.forEach(function(e){
    var mk = monthKey(e.datum);
    if (revByMonth.hasOwnProperty(mk)) revByMonth[mk]+= Number(e.umsatz)||0;
  });
  state.ausgaben.forEach(function(a){
    var mk = monthKey(a.datum);
    if (expByMonth.hasOwnProperty(mk)) expByMonth[mk]+= Number(a.betrag)||0;
  });
  months.forEach(function(mk){
    state.fixkosten.forEach(function(fk){
      if (fixkostenCountsInMonth(fk, mk)) fixByMonth[mk]+= Number(fk.betrag)||0;
    });
  });

  // Umsatzsteuer / Vorsteuer je Monat (aus den hinterlegten MwSt-Sätzen)
  var ustByMonth = {}, vstByMonth = {};
  months.forEach(function(mk){ ustByMonth[mk]=0; vstByMonth[mk]=0; });
  state.einnahmen.forEach(function(e){
    var mk = monthKey(e.datum);
    if (ustByMonth.hasOwnProperty(mk)) ustByMonth[mk]+= steuerOf(e.umsatz, ustSatzOf(e));
  });
  state.ausgaben.forEach(function(a){
    var mk = monthKey(a.datum);
    if (vstByMonth.hasOwnProperty(mk)) vstByMonth[mk]+= steuerOf(a.betrag, ustSatzOf(a));
  });
  months.forEach(function(mk){
    state.fixkosten.forEach(function(fk){
      if (fixkostenCountsInMonth(fk, mk)) vstByMonth[mk]+= steuerOf(fk.betrag, ustSatzOf(fk));
    });
  });
  var ustMonthly = months.map(function(mk,i){
    var ust = ustByMonth[mk], vst = vstByMonth[mk];
    var manuell = (state.meta.ustManuell && state.meta.ustManuell[mk]) || null;
    var zahllast = manuell ? (Number(manuell.betrag)||0) : (ust-vst);
    var abInfo = (state.meta.ustAbgefuehrt && state.meta.ustAbgefuehrt[mk]) || null;
    return {key:mk, label:MONTH_NAMES[i], ust:ust, vorsteuer:vst, zahllast:zahllast, isFuture: mk>nowKey,
            manuell: !!manuell,
            abgefuehrt: !!abInfo, abgefuehrtDatum: abInfo};
  });

  var monthly = months.map(function(mk,i){
    var rev = revByMonth[mk], exp = expByMonth[mk]+fixByMonth[mk];
    return {key:mk, label:MONTH_NAMES[i], rev:rev, exp:exp, profit:rev-exp, isFuture: mk > nowKey};
  });

  // current month KPIs
  var curKey = nowKey;
  var curRow = monthly.filter(function(r){return r.key===curKey;})[0] || {rev:0,exp:0,profit:0};

  // liquidity series: chronological running balance by month across ALL recorded history
  var allDates = state.einnahmen.map(function(e){return e.datum;})
    .concat(state.ausgaben.map(function(a){return a.datum;}));
  var startM = state.meta.startdatum ? monthKey(state.meta.startdatum) : (allDates.length? monthKey(allDates.sort()[0]) : nowKey);
  var endM = nowKey;
  var liqMonths = [];
  var cursor = startM;
  var guard=0;
  while (cursor <= endM && guard < 400){
    liqMonths.push(cursor);
    var parts = cursor.split('-').map(Number);
    parts[1]++; if(parts[1]>12){parts[1]=1; parts[0]++;}
    cursor = parts[0]+'-'+(parts[1]<10?'0':'')+parts[1];
    guard++;
  }
  if (liqMonths.length===0) liqMonths.push(nowKey);

  var running = Number(state.meta.startkontostand)||0;
  var liqSeries = liqMonths.map(function(mk){
    var rev = state.einnahmen.filter(function(e){return monthKey(e.datum)===mk;}).reduce(function(s,e){return s+(Number(e.umsatz)||0);},0);
    var exp = state.ausgaben.filter(function(a){return monthKey(a.datum)===mk;}).reduce(function(s,a){return s+(Number(a.betrag)||0);},0);
    var fix = state.fixkosten.filter(function(fk){return fixkostenCountsInMonth(fk,mk);}).reduce(function(s,fk){return s+(Number(fk.betrag)||0);},0);
    running += rev - exp - fix;
    return {key:mk, balance: running};
  });
  var kontostandAktuell = liqSeries.length ? liqSeries[liqSeries.length-1].balance : (Number(state.meta.startkontostand)||0);

  // per Standort (current year, direct costs only)
  var standortRev = {}, standortExp = {}, standortTn = {};
  state.standorte.forEach(function(s){ standortRev[s]=0; standortExp[s]=0; standortTn[s]=0; });
  state.einnahmen.forEach(function(e){
    if (monthKey(e.datum).slice(0,4)!==String(year)) return;
    if (!standortRev.hasOwnProperty(e.standort)) standortRev[e.standort]=0, standortTn[e.standort]=0, standortExp[e.standort]=0;
    standortRev[e.standort]+= Number(e.umsatz)||0;
    standortTn[e.standort]+= Number(e.teilnehmer)||0;
  });
  state.ausgaben.forEach(function(a){
    if (monthKey(a.datum).slice(0,4)!==String(year)) return;
    if (a.standort==='Allgemein') return;
    if (!standortExp.hasOwnProperty(a.standort)) standortExp[a.standort]=0;
    standortExp[a.standort]+= Number(a.betrag)||0;
  });
  var standortRows = Object.keys(standortRev).map(function(s){
    return {name:s, rev:standortRev[s], exp:standortExp[s]||0, teilnehmer:standortTn[s]||0, profit:(standortRev[s]-(standortExp[s]||0))};
  }).filter(function(r){return r.rev>0 || r.exp>0;});

  // per Kursart (current year)
  var kursRev = {}, kursTn = {};
  state.kursarten.forEach(function(k){ kursRev[k.name]=0; kursTn[k.name]=0; });
  state.einnahmen.forEach(function(e){
    if (monthKey(e.datum).slice(0,4)!==String(year)) return;
    if (!kursRev.hasOwnProperty(e.kursart)) kursRev[e.kursart]=0, kursTn[e.kursart]=0;
    kursRev[e.kursart]+= Number(e.umsatz)||0;
    kursTn[e.kursart]+= Number(e.teilnehmer)||0;
  });
  var kursRows = Object.keys(kursRev).map(function(k){
    return {name:k, rev:kursRev[k], teilnehmer:kursTn[k]};
  }).filter(function(r){return r.rev>0 || r.teilnehmer>0;}).sort(function(a,b){return b.rev-a.rev;});

  // YTD = nur bis einschließlich laufendem Monat (künftige Monate zählen nicht mit,
  // auch wenn dort schon Fixkosten "aktiv" wären).
  var ytdRev = monthly.filter(function(r){return !r.isFuture;}).reduce(function(s,r){return s+r.rev;},0);
  var ytdExp = monthly.filter(function(r){return !r.isFuture;}).reduce(function(s,r){return s+r.exp;},0);
  var curUstRow = ustMonthly.filter(function(r){return r.key===curKey;})[0] || {ust:0,vorsteuer:0,zahllast:0};
  var ytdUst = ustMonthly.filter(function(r){return !r.isFuture;}).reduce(function(s,r){return s+r.ust;},0);
  var ytdVorsteuer = ustMonthly.filter(function(r){return !r.isFuture;}).reduce(function(s,r){return s+r.vorsteuer;},0);
  // Für den YTD-Saldo zählt die tatsächliche Zahllast je Monat (inkl. evtl.
  // manueller Korrekturen), nicht die simple Differenz aus den beiden
  // Jahressummen oben – sonst würde eine manuelle Korrektur für einen
  // einzelnen Monat hier nicht auftauchen.
  var ytdZahllast = ustMonthly.filter(function(r){return !r.isFuture;}).reduce(function(s,r){return s+r.zahllast;},0);

  // Vorausbezahlte Kurse: Geld ist schon eingegangen (steckt im Kontostand),
  // der Kurstermin (und damit die zugehörigen Kosten) liegt aber noch vorn.
  var vorausRows = state.einnahmen.filter(isVorausbezahlt).map(function(e){
    return {termin:e.kurstermin, terminMonat: monthKey(e.kurstermin), standort:e.standort, kursart:e.kursart,
            teilnehmer:e.teilnehmer, betrag:e.umsatz, notiz:e.notiz};
  }).sort(function(a,b){return a.termin.localeCompare(b.termin);});
  var vorausSumme = vorausRows.reduce(function(s,r){return s+r.betrag;},0);
  var vorausByMonat = {};
  vorausRows.forEach(function(r){ vorausByMonat[r.terminMonat] = (vorausByMonat[r.terminMonat]||0) + r.betrag; });
  var vorausMonatlich = Object.keys(vorausByMonat).sort().map(function(mk){
    var parts = mk.split('-');
    return {key:mk, label: MONTH_NAMES[parseInt(parts[1],10)-1]+' '+parts[0], betrag: vorausByMonat[mk]};
  });
  // Je Kalenderjahr, ab 2027: wie viel Geld ist für Kurse eingegangen, die
  // erst in einem künftigen Jahr stattfinden ("nicht anfassbar", weil die
  // zugehörigen Kosten erst dann anfallen). Vor 2027 (z. B. die Lilienthal-
  // Kurse im Oktober 2026) bewusst außen vor gelassen, wie von Lars gewünscht.
  var vorausByJahr = {};
  vorausRows.forEach(function(r){
    var jahr = r.terminMonat.slice(0,4);
    if (Number(jahr) < 2027) return;
    vorausByJahr[jahr] = (vorausByJahr[jahr]||0) + r.betrag;
  });
  var vorausJaehrlich = Object.keys(vorausByJahr).sort().map(function(j){
    return {jahr:j, betrag: vorausByJahr[j]};
  });
  var vorausAb2027Summe = vorausJaehrlich.reduce(function(s,r){return s+r.betrag;},0);
  var frueVerfuegbar = kontostandAktuell - vorausSumme;

  // Noch abzuführende Umsatzsteuer: Summe der Zahllast aller bereits
  // vergangenen/laufenden Monate, für die noch KEINE Abführung ans
  // Finanzamt bestätigt wurde (unabhängig davon, ob quartalsweise oder
  // monatlich gemeldet wird – jeder Monat zählt einzeln). Steckt noch im
  // Kontostand, ist aber eigentlich nicht "frei", weil sie dem Finanzamt
  // zusteht.
  var ustOffenSumme = ustMonthly.filter(function(r){return !r.isFuture && !r.abgefuehrt;}).reduce(function(s,r){return s+r.zahllast;},0);
  var frueVerfuegbarNachUst = frueVerfuegbar - ustOffenSumme;

  // Jährlich fällige, aber täglich "anwachsende" Rücklagen (z. B. Liegeplatz-
  // gebühren, die nur einmal im Jahr abgerechnet werden): Tagessatz × Tage
  // seit der letzten Abrechnung/dem Start = bereits "verbrauchter", aber
  // noch nicht abgeflossener Betrag – steckt noch im Kontostand, ist aber
  // eigentlich schon verplant, damit die Jahresrechnung nicht überrascht.
  var ruecklagenRows = (state.ruecklagen||[]).map(function(r){
    var seit = r.seit || todayISO();
    var tage = daysBetween(seit, todayISO());
    var betrag = (Number(r.tagessatz)||0) * tage;
    return {id:r.id, bezeichnung:r.bezeichnung, standort:r.standort, tagessatz:Number(r.tagessatz)||0, seit:seit, tage:tage, betrag:betrag, notiz:r.notiz||''};
  });
  var ruecklagenSumme = ruecklagenRows.reduce(function(s,r){return s+r.betrag;},0);
  var frueVerfuegbarGesamt = frueVerfuegbarNachUst - ruecklagenSumme;

  return {
    vorausRows:vorausRows, vorausSumme:vorausSumme, vorausMonatlich:vorausMonatlich, frueVerfuegbar:frueVerfuegbar,
    vorausJaehrlich:vorausJaehrlich, vorausAb2027Summe:vorausAb2027Summe,
    ustOffenSumme:ustOffenSumme, frueVerfuegbarNachUst:frueVerfuegbarNachUst,
    ruecklagenRows:ruecklagenRows, ruecklagenSumme:ruecklagenSumme, frueVerfuegbarGesamt:frueVerfuegbarGesamt,
    year:year, monthly:monthly, curRow:curRow, curKey:curKey,
    liqSeries:liqSeries, kontostandAktuell:kontostandAktuell,
    standortRows:standortRows, kursRows:kursRows,
    ytdRev:ytdRev, ytdExp:ytdExp, ytdProfit:ytdRev-ytdExp,
    ustMonthly:ustMonthly, curUstRow:curUstRow, ytdUst:ytdUst, ytdVorsteuer:ytdVorsteuer, ytdZahllast:ytdZahllast
  };
}

/* ============================= SVG CHARTS ============================= */
function svgEl(tag, attrs){
  var s='<'+tag+' ';
  for (var k in attrs) s+= k+'="'+attrs[k]+'" ';
  return s+'/>';
}

function barLineChart(monthly){
  var W=640, H=230, padL=44, padR=10, padT=14, padB=26;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  var maxVal = Math.max(1, ...monthly.map(function(r){return Math.max(r.rev, r.exp);}));
  var maxProfit = Math.max(1, ...monthly.map(function(r){return Math.abs(r.profit);}));
  var scaleY = function(v){ return innerH - (v/maxVal)*innerH; };
  var n = monthly.length;
  var groupW = innerW/n;
  var barW = groupW*0.30;

  var bars='', gridlines='', xlabels='';
  var steps=4;
  for (var g=0; g<=steps; g++){
    var v = maxVal*g/steps;
    var y = padT+scaleY(v);
    gridlines += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    gridlines += '<text x="'+(padL-8)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-dim)">'+eurShort(v)+'</text>';
  }

  monthly.forEach(function(r,i){
    var cx = padL + groupW*i + groupW/2;
    var xr = cx - barW - 2;
    var xe = cx + 2;
    var hr = (r.rev/maxVal)*innerH;
    var he = (r.exp/maxVal)*innerH;
    var op = r.isFuture ? '0.28' : '1';
    bars += '<rect x="'+xr.toFixed(1)+'" y="'+(padT+innerH-hr).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+hr.toFixed(1)+'" rx="2" fill="var(--navy)" opacity="'+op+'"/>';
    bars += '<rect x="'+xe.toFixed(1)+'" y="'+(padT+innerH-he).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+he.toFixed(1)+'" rx="2" fill="var(--brass)" opacity="'+op+'"/>';
    xlabels += '<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--ink-dim)" font-family="Public Sans, sans-serif">'+r.label+'</text>';
  });

  // profit line (secondary axis, scaled independently, drawn as path)
  var linePts = monthly.map(function(r,i){
    var cx = padL + groupW*i + groupW/2;
    var t = (r.profit + maxProfit) / (2*maxProfit); // 0..1, 0.5 = zero line
    var y = padT + innerH - t*innerH;
    return [cx,y];
  });
  var path = linePts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  var zeroY = padT + innerH/2;

  var dots = linePts.map(function(p,i){
    var col = monthly[i].profit>=0 ? 'var(--good)' : 'var(--bad)';
    var op = monthly[i].isFuture ? '0.25' : '1';
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="'+col+'" opacity="'+op+'"/>';
  }).join('');

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px" role="img" aria-label="Monatliche Einnahmen, Ausgaben und Gewinn">'+
    gridlines+
    '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+zeroY.toFixed(1)+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--ink-dim)" stroke-dasharray="2,3" stroke-width="1"/>'+
    bars+
    '<path d="'+path+'" fill="none" stroke="var(--petrol)" stroke-width="2"/>'+
    dots+
    xlabels+
    '</svg>';
}

function liquidityChart(series, startBalance, reserveLevel){
  var W=640, H=190, padL=54, padR=14, padT=16, padB=26;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  if (series.length===0) return '<p style="color:var(--ink-dim); font-size:13px;">Noch keine Daten.</p>';
  var vals = series.map(function(s){return s.balance;}).concat([startBalance]);
  if (reserveLevel) vals.push(reserveLevel);
  var minV = Math.min(...vals, 0), maxV = Math.max(...vals, 0);
  if (maxV===minV){ maxV+=1; minV-=1; }
  var range = maxV-minV;
  var scaleY = function(v){ return padT + innerH - ((v-minV)/range)*innerH; };
  var n = series.length;
  var stepX = n>1 ? innerW/(n-1) : 0;

  var pts = series.map(function(s,i){ return [padL+stepX*i, scaleY(s.balance)]; });
  var linePath = pts.map(function(p,i){return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var areaPath = linePath + ' L'+pts[pts.length-1][0].toFixed(1)+','+(padT+innerH)+' L'+pts[0][0].toFixed(1)+','+(padT+innerH)+' Z';

  var gridlines='';
  var steps=4;
  for (var g=0; g<=steps; g++){
    var v = minV + range*g/steps;
    var y = scaleY(v);
    gridlines += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    gridlines += '<text x="'+(padL-8)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-dim)">'+eurShort(v)+'</text>';
  }
  var zeroY = scaleY(0);
  var xlabels='';
  var labelEvery = n>10 ? Math.ceil(n/8) : 1;
  series.forEach(function(s,i){
    if (i%labelEvery!==0 && i!==n-1) return;
    var parts = s.key.split('-');
    var lbl = MONTH_NAMES[parseInt(parts[1],10)-1]+" '"+parts[0].slice(2);
    xlabels += '<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)" font-family="Public Sans, sans-serif">'+lbl+'</text>';
  });
  var last = pts[pts.length-1];
  var lastCol = series[series.length-1].balance>=0 ? 'var(--good)' : 'var(--bad)';
  var reserveY = reserveLevel ? scaleY(reserveLevel) : null;

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px" role="img" aria-label="Kontostand-Verlauf">'+
    '<defs><linearGradient id="liqfill" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="var(--petrol)" stop-opacity="0.28"/>'+
      '<stop offset="100%" stop-color="var(--petrol)" stop-opacity="0.02"/>'+
    '</linearGradient></defs>'+
    gridlines+
    (minV<0 && maxV>0 ? '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+zeroY.toFixed(1)+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--bad)" stroke-dasharray="2,3" stroke-width="1"/>' : '')+
    (reserveY!=null ? '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+reserveY.toFixed(1)+'" y2="'+reserveY.toFixed(1)+'" stroke="var(--brass)" stroke-dasharray="4,3" stroke-width="1.4"/>'+
      '<text x="'+(W-padR)+'" y="'+(reserveY-4).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--brass-ink)" font-family="Public Sans, sans-serif">Rücklage vorausbezahlte Kurse</text>' : '')+
    '<path d="'+areaPath+'" fill="url(#liqfill)"/>'+
    '<path d="'+linePath+'" fill="none" stroke="var(--petrol)" stroke-width="2.2"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" fill="'+lastCol+'"/>'+
    xlabels+
    '</svg>';
}

function hbarChart(rows, keyFn, valFn, fmt){
  if (rows.length===0) return '<p style="color:var(--ink-dim); font-size:13px;">Noch keine Daten für '+currentYear()+'.</p>';
  var maxV = Math.max(1, ...rows.map(function(r){return Math.abs(valFn(r));}));
  var out = '<div style="display:flex; flex-direction:column; gap:10px;">';
  rows.forEach(function(r){
    var v = valFn(r);
    var pct = Math.max(2, Math.abs(v)/maxV*100);
    var col = v<0 ? 'var(--bad)' : 'var(--petrol)';
    out += '<div>'+
      '<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;"><span>'+escapeHtml(keyFn(r))+'</span><span class="num" style="color:'+col+'">'+fmt(v)+'</span></div>'+
      '<div style="height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden;"><div style="width:'+pct.toFixed(1)+'%; height:100%; background:'+col+'; border-radius:5px;"></div></div>'+
      '</div>';
  });
  return out+'</div>';
}

/* ============================= RENDER: DASHBOARD ============================= */
function renderDashboard(){
  var m = computeMetrics();
  var needsSetup = !state.meta.startkontostand && state.meta.startkontostand!==0 || (state.einnahmen.length===0 && state.ausgaben.length===0 && !state.meta.startkontostandSet);

  var html = '<div class="pagehead"><h1>Übersicht</h1><p>Wirtschaftliche Lage der Bootsschule Bremen GmbH · '+m.year+'</p></div>';

  if (!state.meta.startkontostandSet){
    html += '<div class="banner"><span class="ic">⚑</span><div>Lege zuerst in <strong>Einstellungen</strong> den Startkontostand fest, damit die Liquiditätsübersicht stimmt. Trage danach laufend deine Einnahmen und Ausgaben ein.</div>'+
      '<button class="btn small" data-goto="einstellungen">Jetzt einrichten</button></div>';
  }

  html += '<div class="kpi-row">'+
    '<div class="kpi"><div class="label">Umsatz · '+MONTH_NAMES[new Date().getMonth()]+' '+m.year+'</div><div class="value">'+eur(m.curRow.rev)+'</div><div class="sub">laufender Monat</div></div>'+
    '<div class="kpi"><div class="label">Kosten · laufender Monat</div><div class="value">'+eur(m.curRow.exp)+'</div><div class="sub">variabel + anteilige Fixkosten</div></div>'+
    '<div class="kpi '+(m.curRow.profit>=0?'good':'bad')+'"><div class="label">Gewinn / Verlust</div><div class="value">'+eur(m.curRow.profit)+'</div><div class="sub">laufender Monat</div></div>'+
    '<div class="kpi '+(m.kontostandAktuell>=0?'good':'bad')+'"><div class="label">Kontostand aktuell</div><div class="value">'+eur(m.kontostandAktuell)+'</div><div class="sub">Stand heute (Liquidität)</div></div>'+
    '</div>';

  // Die eine Zahl, die zählt: statt mehrerer separater, alle grün eingefärbter
  // Kacheln (Kontostand, davon frei verfügbar, offene USt, …) gibt es genau
  // EINE hervorgehobene Kachel mit dem Endergebnis; die Bestandteile stehen
  // als schlichter Text darunter statt als eigene bunte Kachel.
  var hkTeile = ['Kontostand '+eur(m.kontostandAktuell)];
  if (m.vorausSumme > 0) hkTeile.push('Rücklage vorausbezahlte Kurse −'+eur(m.vorausSumme));
  if (m.ustOffenSumme !== 0) hkTeile.push((m.ustOffenSumme>0?'noch abzuführende USt −':'USt-Guthaben +')+eur(Math.abs(m.ustOffenSumme)));
  if (m.ruecklagenSumme > 0) hkTeile.push('Rücklage Liegeplatz/Werft −'+eur(m.ruecklagenSumme));
  html += '<div class="highlight-kpi '+(m.frueVerfuegbarGesamt>=0?'good':'bad')+'">'+
    '<div class="hk-label">Wirklich frei verfügbar</div>'+
    '<div class="hk-value">'+eur(m.frueVerfuegbarGesamt)+'</div>'+
    '<div class="hk-breakdown">'+hkTeile.join(' · ')+'</div>'+
    '</div>';

  html += '<div class="card">'+
    '<h2>Monatsübersicht '+m.year+'</h2><div class="cardsub">Umsatz, Kosten und Gewinn je Monat</div>'+
    '<div class="chart-wrap">'+barLineChart(m.monthly)+'</div>'+
    '<div class="legend">'+
      '<span><span class="sw" style="background:var(--navy)"></span>Umsatz</span>'+
      '<span><span class="sw" style="background:var(--brass)"></span>Kosten (inkl. Fixkosten)</span>'+
      '<span><span class="sw" style="background:var(--petrol)"></span>Gewinn/Verlust (Linie)</span>'+
    '</div>'+
    '<div class="cardsub" style="margin-top:12px; margin-bottom:0;">Jahressumme '+m.year+': Umsatz '+eur(m.ytdRev)+' · Kosten '+eur(m.ytdExp)+' · Ergebnis <strong style="color:'+(m.ytdProfit>=0?'var(--good)':'var(--bad)')+'">'+eur(m.ytdProfit)+'</strong></div>'+
    '</div>';

  html += '<div class="card">'+
    '<h2>Liquiditätsverlauf</h2><div class="cardsub">Kontostand seit Start · aktueller Stand: <strong>'+eur(m.kontostandAktuell)+'</strong>'+(m.vorausSumme>0?' · davon reserviert für vorausbezahlte Kurse: <strong>'+eur(m.vorausSumme)+'</strong>':'')+'</div>'+
    '<div class="chart-wrap">'+liquidityChart(m.liqSeries, Number(state.meta.startkontostand)||0, m.vorausSumme)+'</div>'+
    (m.vorausSumme>0 ? '<div class="cardsub" style="margin-top:8px; margin-bottom:0;">Die gestrichelte Linie zeigt, wie viel vom aktuellen Kontostand bereits für Kurse reserviert ist, die erst künftig stattfinden (siehe Karte „Vorausbezahlte Kurse" unten) – rutscht der Kontostand unter diese Linie, ist das Geld für den künftigen Kurs eigentlich schon verplant.</div>' : '')+
    '</div>';

  if (m.vorausSumme > 0){
    html += '<div class="card">'+
      '<h2>Vorausbezahlte Kurse</h2><div class="cardsub">Bereits bezahlt, Kurstermin liegt aber noch in der Zukunft · Summe: <strong style="color:var(--brass-ink);">'+eur(m.vorausSumme)+'</strong></div>'+
      '<div class="table-wrap"><table>'+
      '<thead><tr><th>Kurstermin</th><th>Standort</th><th>Kursart</th><th class="num">TN</th><th class="num">Betrag</th><th>Notiz</th></tr></thead>'+
      '<tbody>'+m.vorausRows.map(function(r){
        return '<tr><td class="num">'+r.termin+'</td><td>'+escapeHtml(r.standort)+'</td><td>'+escapeHtml(r.kursart)+'</td>'+
          '<td class="num">'+r.teilnehmer+'</td><td class="num">'+eur(r.betrag)+'</td><td class="wrap">'+escapeHtml(r.notiz)+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
      (m.vorausMonatlich.length>1 ? '<div class="cardsub" style="margin-top:12px; margin-bottom:0;">Je Monat: '+m.vorausMonatlich.map(function(v){return v.label+' '+eur(v.betrag);}).join(' · ')+'</div>' : '')+
      (m.vorausJaehrlich.length>0 ? '<div class="cardsub" style="margin-top:6px; margin-bottom:0;">Je Jahr (ab 2027 – künftig noch nicht anfassbares Geld): '+m.vorausJaehrlich.map(function(v){return v.jahr+': '+eur(v.betrag);}).join(' · ')+'</div>' : '')+
      '</div>';
  }

  if (m.ruecklagenRows.length > 0){
    html += '<div class="card">'+
      '<h2>Jährliche Rücklagen (Liegeplatz, Werft, …)</h2><div class="cardsub">Täglich anwachsende Kosten, die nur 1× im Jahr abgerechnet werden · Summe: <strong style="color:var(--brass-ink);">'+eur(m.ruecklagenSumme)+'</strong></div>'+
      '<div class="table-wrap"><table>'+
      '<thead><tr><th>Bezeichnung</th><th>Standort</th><th class="num">Tagessatz</th><th>Läuft seit</th><th class="num">Tage</th><th class="num">Aufgelaufen</th></tr></thead>'+
      '<tbody>'+m.ruecklagenRows.map(function(r){
        return '<tr><td class="wrap">'+escapeHtml(r.bezeichnung)+'</td><td>'+escapeHtml(r.standort||'')+'</td>'+
          '<td class="num">'+eur(r.tagessatz)+'</td><td class="num">'+deDate(r.seit)+'</td><td class="num">'+r.tage+'</td>'+
          '<td class="num">'+eur(r.betrag)+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
      '<div class="cardsub" style="margin-top:8px; margin-bottom:0;">Verwaltet im Tab „Fixkosten" – dort auch als „✓ beglichen" markierbar, sobald die Jahresrechnung tatsächlich gezahlt wurde.</div>'+
      '</div>';
  }

  html += '<div class="grid-2">'+
    '<div class="card"><h2>Rentabilität je Standort</h2><div class="cardsub">Umsatz ./. direkte Ausgaben · '+m.year+'</div>'+
      hbarChart(m.standortRows, function(r){return r.name;}, function(r){return r.profit;}, eur)+
    '</div>'+
    '<div class="card"><h2>Auslastung je Kursart</h2><div class="cardsub">Teilnehmer · '+m.year+'</div>'+
      hbarChart(m.kursRows.slice(0,8), function(r){return r.name;}, function(r){return r.teilnehmer;}, function(v){return v+' TN';})+
    '</div>'+
  '</div>';

  html += '<div class="card"><h2>Umsatz je Kursart</h2><div class="cardsub">'+m.year+'</div>'+
    hbarChart(m.kursRows, function(r){return r.name;}, function(r){return r.rev;}, eur)+
    '</div>';

  document.getElementById('panel-dashboard').innerHTML = html;
  document.querySelectorAll('[data-goto]').forEach(function(b){
    b.addEventListener('click', function(){ activateTab(b.getAttribute('data-goto')); });
  });
}

/* ============================= RENDER: KURSE =============================
   Kurse sind konkrete, geplante Durchführungen (Nummer, Ort, Termin, max.
   Teilnehmerzahl) – anders als "Kursart" (nur der Produkttyp/Preis-Vorlage
   bei Einnahmen). Einnahmen werden optional einem Kurs zugeordnet (egal
   über welchen Kanal die Buchung reinkam: Onlineshop/PayPal, Bar, Rechnung
   per Telefon, Überweisung), damit sich Teilnehmerliste, Auslastung und die
   Umsatzsteuer je Kurs auf einen Blick ablesen lassen. */
function kursLabel(k){
  return (k.nummer?('#'+k.nummer+' – '):'')+(k.bezeichnung||'(ohne Bezeichnung)');
}
function kursTeilnehmerZahl(k){
  return (k.teilnehmer||[]).length;
}
var ZAHLUNG_STATUS = ['ausstehend','erfolgt'];
function zahlungStatusBadge(status){
  var ok = status==='erfolgt';
  return '<span class="badge" style="background:'+(ok?'var(--good-bg)':'var(--surface-2)')+';color:'+(ok?'var(--good)':'var(--ink-dim)')+';">'+(ok?'✓ erfolgt':'ausstehend')+'</span>';
}
function renderKurse(){
  var html = '<div class="pagehead"><h1>Kurse</h1><p>Kurse mit Nummer, Ort und maximaler Teilnehmerzahl anlegen – Einnahmen (egal über welchen Kanal gebucht) lassen sich dann einem Kurs zuordnen</p></div>';

  if (!readOnly){
    html += '<div class="card"><h2>Neuen Kurs anlegen</h2>'+
      '<form id="form-kurs" class="form-row">'+
      '<div class="field"><label>Nummer</label><input type="text" name="nummer" placeholder="z. B. K-2026-041" style="width:120px;"></div>'+
      '<div class="field grow"><label>Bezeichnung</label><select name="bezeichnung" id="kurs-bezeichnung-select">'+optionList(state.kursarten)+'</select></div>'+
      '<div class="field"><label>Ort</label><select name="ort">'+optionList(state.standorte)+'</select></div>'+
      '<div class="field"><label>Kurstermin</label><input type="date" name="datum"></div>'+
      '<div class="field"><label>Max. Teilnehmer</label><input class="num-input" type="number" min="0" step="1" name="maxTeilnehmer" style="width:110px;"></div>'+
      '<div class="field grow"><label>Notiz (optional)</label><input type="text" name="notiz" placeholder="z. B. Ausbilder, Boot"></div>'+
      '<button class="btn" type="submit">Anlegen</button>'+
      '</form>'+
      '</div>';
  }

  html += '<div class="card"><h2>Angelegte Kurse</h2>'+
    '<div class="table-wrap"><table id="tbl-kurse">'+
    '<thead><tr><th>Nummer</th><th>Bezeichnung</th><th>Ort</th><th>Termin</th><th class="num">Teilnehmer</th><th class="num">Umsatz</th><th class="num">davon USt</th><th>Notiz</th><th></th></tr></thead>'+
    '<tbody></tbody></table></div></div>';

  html += '<div class="card"><h2>Teilnehmerliste</h2>'+
    '<p class="cardsub">Wer ist für einen Kurs angemeldet – Name, Kontakt, Rechnungsnr. und Zahlungsstatus. Ersetzt die separate Teilnehmerlisten-Tabelle.</p>'+
    '<div class="field" style="max-width:420px;"><label>Kurs auswählen</label><select id="teilnehmer-kurs-select"></select></div>'+
    '<div id="teilnehmer-form-wrap"></div>'+
    '<div class="table-wrap"><table id="tbl-teilnehmer">'+
    '<thead><tr><th>Anrede</th><th>Name</th><th>E-Mail</th><th>Telefon</th><th>Adresse</th><th class="num">Betrag</th><th>Zahlung</th><th>Rech.-Nr.</th><th>Notiz</th><th></th></tr></thead>'+
    '<tbody></tbody></table></div></div>';

  document.getElementById('panel-kurse').innerHTML = html;
  renderKurseTable();
  renderKursTeilnehmerSection();

  if (!readOnly){
    document.getElementById('form-kurs').addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(ev.target);
      state.kurse.push({
        id: uid(), nummer: fd.get('nummer')||'', bezeichnung: fd.get('bezeichnung')||'',
        ort: fd.get('ort')||'', datum: fd.get('datum')||'',
        maxTeilnehmer: fd.get('maxTeilnehmer') ? Number(fd.get('maxTeilnehmer')) : null,
        notiz: fd.get('notiz')||'', teilnehmer: []
      });
      persistAndRefresh('Kurs angelegt.');
      ev.target.reset();
    });
  }
}

function renderKursTeilnehmerSection(){
  var sel = document.getElementById('teilnehmer-kurs-select');
  var rows = state.kurse.slice().sort(function(a,b){
    return (b.datum||'').localeCompare(a.datum||'') || (a.nummer||'').localeCompare(b.nummer||'');
  });
  if (rows.length===0){
    sel.innerHTML = '<option value="">– noch keine Kurse angelegt –</option>';
    document.getElementById('teilnehmer-form-wrap').innerHTML = '';
    document.querySelector('#tbl-teilnehmer tbody').innerHTML = '<tr class="empty-row"><td colspan="10">Erst einen Kurs anlegen.</td></tr>';
    return;
  }
  var stored = uiFilters['teilnehmer-kurs-select'];
  var current = (stored && rows.some(function(k){return k.id===stored;})) ? stored : rows[0].id;
  sel.innerHTML = rows.map(function(k){
    return '<option value="'+k.id+'" '+(k.id===current?'selected':'')+'>'+escapeHtml(kursLabel(k))+(k.ort?(' · '+escapeHtml(k.ort)):'')+(k.datum?(' · '+k.datum):'')+'</option>';
  }).join('');
  uiFilters['teilnehmer-kurs-select'] = current;
  sel.addEventListener('change', function(){
    rememberFilter('teilnehmer-kurs-select');
    current = sel.value;
    renderKursTeilnehmerForm(current);
    renderKursTeilnehmerTable(current);
  });
  renderKursTeilnehmerForm(current);
  renderKursTeilnehmerTable(current);
}

function renderKursTeilnehmerForm(kursId){
  var wrap = document.getElementById('teilnehmer-form-wrap');
  if (readOnly){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<form id="form-teilnehmer" class="form-row" style="margin:10px 0;">'+
    '<div class="field"><label>Anrede</label><select name="anrede"><option>Herr</option><option>Frau</option><option>Divers</option></select></div>'+
    '<div class="field"><label>Nachname</label><input type="text" name="nachname" required></div>'+
    '<div class="field"><label>Vorname</label><input type="text" name="vorname"></div>'+
    '<div class="field"><label>E-Mail</label><input type="email" name="email"></div>'+
    '<div class="field"><label>Telefon</label><input type="text" name="telefon"></div>'+
    '<div class="field grow"><label>Adresse</label><input type="text" name="adresse"></div>'+
    '<div class="field"><label>Betrag (€)</label><input class="num-input" type="number" step="0.01" name="betrag" style="width:110px;"></div>'+
    '<div class="field"><label>Zahlung</label><select name="zahlungStatus">'+
      ZAHLUNG_STATUS.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('')+
    '</select></div>'+
    '<div class="field"><label>Rech.-Nr.</label><input type="text" name="rechnungsnummer" style="width:110px;"></div>'+
    '<div class="field grow"><label>Notiz (optional)</label><input type="text" name="notiz"></div>'+
    '<button class="btn" type="submit">Teilnehmer hinzufügen</button>'+
    '</form>';
  document.getElementById('form-teilnehmer').addEventListener('submit', function(ev){
    ev.preventDefault();
    var fd = new FormData(ev.target);
    var kurs = state.kurse.find(function(k){return k.id===kursId;});
    if (!kurs) return;
    if (!kurs.teilnehmer) kurs.teilnehmer = [];
    kurs.teilnehmer.push({
      id: uid(), anrede: fd.get('anrede')||'', nachname: fd.get('nachname')||'', vorname: fd.get('vorname')||'',
      email: fd.get('email')||'', telefon: fd.get('telefon')||'', adresse: fd.get('adresse')||'',
      betrag: fd.get('betrag')?Number(fd.get('betrag')):null, zahlungStatus: fd.get('zahlungStatus')||'ausstehend',
      rechnungsnummer: fd.get('rechnungsnummer')||'', notiz: fd.get('notiz')||''
    });
    persistAndRefresh('Teilnehmer hinzugefügt.');
  });
}

function renderKursTeilnehmerTable(kursId){
  var tbody = document.querySelector('#tbl-teilnehmer tbody');
  var kurs = state.kurse.find(function(k){return k.id===kursId;});
  var list = kurs ? (kurs.teilnehmer||[]) : [];
  if (list.length===0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">Noch keine Teilnehmer für diesen Kurs erfasst.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(t){
    var name = (t.nachname||'')+(t.vorname?(', '+t.vorname):'');
    return '<tr><td>'+escapeHtml(t.anrede)+'</td><td class="wrap">'+escapeHtml(name)+'</td>'+
      '<td class="wrap">'+escapeHtml(t.email)+'</td><td>'+escapeHtml(t.telefon)+'</td>'+
      '<td class="wrap">'+escapeHtml(t.adresse)+'</td>'+
      '<td class="num">'+(t.betrag!=null?eur(t.betrag):'–')+'</td>'+
      '<td>'+zahlungStatusBadge(t.zahlungStatus)+'</td>'+
      '<td>'+escapeHtml(t.rechnungsnummer)+'</td><td class="wrap">'+escapeHtml(t.notiz)+'</td>'+
      '<td>'+(readOnly?'':'<button class="del-btn" data-del-teilnehmer="'+t.id+'" title="Löschen">✕</button>')+'</td></tr>';
  }).join('');
  tbody.querySelectorAll('[data-del-teilnehmer]').forEach(function(b){
    b.addEventListener('click', function(){
      var tid = b.getAttribute('data-del-teilnehmer');
      kurs.teilnehmer = kurs.teilnehmer.filter(function(t){return t.id!==tid;});
      persistAndRefresh('Teilnehmer entfernt.');
    });
  });
}

function renderKurseTable(){
  var rows = state.kurse.slice().sort(function(a,b){
    return (b.datum||'').localeCompare(a.datum||'') || (a.nummer||'').localeCompare(b.nummer||'');
  });
  var tbody = document.querySelector('#tbl-kurse tbody');
  if (rows.length===0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Noch keine Kurse angelegt.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(k){
    var linked = state.einnahmen.filter(function(e){return e.kursId===k.id;});
    var tn = kursTeilnehmerZahl(k);
    var umsatz = linked.reduce(function(s,e){return s+(Number(e.umsatz)||0);},0);
    var ustSumme = linked.reduce(function(s,e){return s+steuerOf(e.umsatz, ustSatzOf(e));},0);
    var maxTnBadge = (k.maxTeilnehmer!=null && tn>=k.maxTeilnehmer) ? ' <span class="badge" style="background:var(--bad-bg);color:var(--bad);">voll</span>' : '';
    var nummerCell = readOnly ? escapeHtml(k.nummer) : inlineEditInput(k.id, 'nummer', 'text', k.nummer, 'style="width:100px;"');
    var ortCell = readOnly ? escapeHtml(k.ort) : ortInlineSelect(k.id, 'ort', k.ort);
    var datumCell = readOnly ? (k.datum||'–') : inlineEditInput(k.id, 'datum', 'date', k.datum, 'style="min-width:130px;"');
    var maxTnCell = readOnly ? (k.maxTeilnehmer!=null?String(k.maxTeilnehmer):'–') : inlineEditInput(k.id, 'maxTeilnehmer', 'number', k.maxTeilnehmer, 'min="0" step="1" style="width:60px;"');
    return '<tr><td>'+nummerCell+'</td><td class="wrap">'+escapeHtml(k.bezeichnung)+'</td><td>'+ortCell+'</td>'+
      '<td class="num">'+datumCell+'</td><td class="num">'+tn+' / '+maxTnCell+maxTnBadge+'</td>'+
      '<td class="num">'+eur(umsatz)+'</td><td class="num">'+eur(ustSumme)+'</td>'+
      '<td class="wrap">'+escapeHtml(k.notiz)+'</td>'+
      '<td>'+(readOnly?'':'<button class="del-btn" data-del-kurs="'+k.id+'" title="Löschen">✕</button>')+'</td></tr>';
  }).join('');
  tbody.querySelectorAll('.inline-edit-input').forEach(function(inp){
    inp.addEventListener('change', function(){
      var id = inp.getAttribute('data-editid');
      var field = inp.getAttribute('data-field');
      var k = state.kurse.filter(function(x){return x.id===id;})[0];
      if (!k) return;
      if (field==='maxTeilnehmer'){
        k.maxTeilnehmer = inp.value===''? null : Number(inp.value);
      } else if (field==='datum'){
        var oldDatum = k.datum;
        k.datum = inp.value||'';
        // Verknüpfte Einnahmen ohne eigenen (abweichenden) Kurstermin folgen
        // automatisch dem neuen Kursdatum – manuell gesetzte Kurstermine
        // (die vom alten Kursdatum abweichen) bleiben unangetastet.
        state.einnahmen.forEach(function(e){
          if (e.kursId===k.id && (!e.kurstermin || e.kurstermin===oldDatum)) e.kurstermin = k.datum;
        });
      } else {
        k[field] = inp.value;
      }
      persistAndRefresh('Gespeichert.');
    });
  });
  tbody.querySelectorAll('.inline-edit').forEach(function(sel){
    sel.addEventListener('change', function(){
      var id = sel.getAttribute('data-editid');
      var field = sel.getAttribute('data-field');
      var k = state.kurse.filter(function(x){return x.id===id;})[0];
      if (k){ k[field] = sel.value; persistAndRefresh('Gespeichert.'); }
    });
  });
  tbody.querySelectorAll('[data-del-kurs]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-del-kurs');
      state.kurse = state.kurse.filter(function(k){return k.id!==id;});
      state.einnahmen.forEach(function(e){ if (e.kursId===id) e.kursId=''; });
      persistAndRefresh('Kurs gelöscht. Zugeordnete Einnahmen bleiben erhalten, sind jetzt aber keinem Kurs mehr zugeordnet.');
    });
  });
}

/* ============================= RENDER: EINNAHMEN ============================= */
function optionList(items, selected){
  return items.map(function(it){
    var v = typeof it==='string' ? it : it.name;
    return '<option value="'+escapeHtml(v)+'" '+(v===selected?'selected':'')+'>'+escapeHtml(v)+'</option>';
  }).join('');
}

// Wie optionList(), aber falls der aktuelle Wert nicht (mehr) in der Liste
// vorkommt (z. B. ein älterer/individueller Wert), wird er zusätzlich als
// eigene Option vorangestellt, statt beim Rendern stillschweigend auf den
// ersten Listeneintrag umzuspringen.
function optionListWithCustom(items, selected){
  var names = items.map(function(it){ return typeof it==='string' ? it : it.name; });
  var extra = (selected && names.indexOf(selected)===-1) ?
    '<option value="'+escapeHtml(selected)+'" selected>'+escapeHtml(selected)+'</option>' : '';
  return extra + optionList(items, selected);
}

function ustSelect(name, selected){
  var opts = [[19,'19 % (Regelsatz)'],[7,'7 % (ermäßigt)'],[0,'0 % (steuerfrei/ohne Vorsteuer)']];
  var sel = selected==null ? 19 : Number(selected);
  return '<select name="'+name+'">'+opts.map(function(o){
    return '<option value="'+o[0]+'" '+(o[0]===sel?'selected':'')+'>'+o[1]+'</option>';
  }).join('')+'</select>';
}
function ustBadge(satz){
  var s = Number(satz)||0;
  return '<span class="num" style="color:var(--ink-dim);">'+s+' %</span>';
}
var UST_OPTS = [[19,'19 %'],[7,'7 %'],[0,'0 %']];
function ustOptionList(selected){
  var sel = selected==null ? 19 : Number(selected);
  return UST_OPTS.map(function(o){
    return '<option value="'+o[0]+'" '+(o[0]===sel?'selected':'')+'>'+o[1]+'</option>';
  }).join('');
}
// Inline-editierbares MwSt-Satz-Dropdown für Tabellenzeilen (Einnahmen/Ausgaben/Fixkosten).
function ustInlineSelect(id, field, selected){
  return '<select class="inline-edit" data-editid="'+id+'" data-field="'+field+'">'+ustOptionList(selected)+'</select>';
}

/* ===== Zahlungsart + Abgleich-Status (Einnahmen/Ausgaben) =====
   Damit sich schnell sehen lässt, über welchen Kanal eine Buchung lief
   (wichtig, weil neben dem Sparkassen-Kontoauszug auch SumUp, PayPal,
   Onlineshop und Barzahlungen eigene "Auszüge"/Übersichten haben) und ob
   sie schon gegen den jeweiligen Auszug geprüft wurde – für einen
   schnellen Monatsabschluss, nicht für Bilanz/Gewinnermittlung. */
var ZAHLUNGSARTEN = ['Überweisung/Kontoauszug','Bar','SumUp','PayPal','Onlineshop','Sonstige'];
function zahlungsartInlineSelect(id, field, selected){
  var opts = '<option value="">–</option>'+optionListWithCustom(ZAHLUNGSARTEN, selected);
  return '<select class="inline-edit select-narrow" data-editid="'+id+'" data-field="'+field+'" title="'+escapeHtml(selected||'–')+'">'+opts+'</select>';
}
// Inline-editierbare Text-/Zahl-/Datumsfelder (z. B. für die Kurse-Tabelle:
// Nummer, Ort, Termin, Max. Teilnehmer). Analog zum inline-edit-Dropdown,
// aber als <input>, weil hier Freitext/Datum/Zahl statt einer festen
// Auswahlliste gebraucht wird.
function inlineEditInput(id, field, type, value, extra){
  var v = value==null ? '' : value;
  return '<input class="inline-edit-input" data-editid="'+id+'" data-field="'+field+'" type="'+type+'" value="'+escapeHtml(v)+'" '+(extra||'')+'>';
}
function ortInlineSelect(id, field, selected){
  var opts = '<option value="">–</option>'+optionListWithCustom(state.standorte, selected);
  return '<select class="inline-edit select-narrow" data-editid="'+id+'" data-field="'+field+'" title="'+escapeHtml(selected||'–')+'">'+opts+'</select>';
}
function abgleichBadge(id, abgeglichen){
  if (readOnly){
    return abgeglichen ?
      '<span class="badge" title="abgeglichen" style="background:var(--good-bg);color:var(--good);">✓</span>' :
      '<span class="badge" title="offen" style="background:var(--surface-2);color:var(--ink-dim);">offen</span>';
  }
  return abgeglichen ?
    '<button type="button" class="badge" data-toggle-abgleich="'+id+'" title="abgeglichen (klicken zum Ändern)" style="background:var(--good-bg);color:var(--good);border:none;cursor:pointer;">✓</button>' :

/* ============================= ABRECHNUNGSPERIODE (Minijobber, Stichtag 15.) ============================= */
// Die Bootsschule meldet Minijob-Stunden zum 15. jeden Monats ans Steuerbüro.
// Eine Periode läuft vom 16. eines Monats bis zum 15. des Folgemonats.
function periodInfo(dateStr){
  function pad(n){ return (n<10?'0':'')+n; }
  var d = new Date(dateStr+'T00:00:00');
  var day = d.getDate();
  var endY = d.getFullYear();
  var endM = d.getMonth()+1; // Monat des Stichtags (15.), 1-12
  if (day > 15){
    endM += 1;
    if (endM > 12){ endM = 1; endY += 1; }
  }
  var endDate = new Date(endY, endM-1, 15);
  var startDate = new Date(endY, endM-2, 16);
  function iso(dt){ return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
  function de(dt){ return pad(dt.getDate())+'.'+pad(dt.getMonth()+1)+'.'+dt.getFullYear(); }
  return {
    key: iso(endDate),
    startISO: iso(startDate),
    endISO: iso(endDate),
    label: de(startDate)+' – '+de(endDate),
    shortLabel: 'bis '+de(endDate)
  };
}

function fillPeriodFilter(selectId, dates){
  var todayP = periodInfo(todayISO());
  var byKey = {};
  byKey[todayP.key] = todayP;
  dates.forEach(function(d){ var p = periodInfo(d); byKey[p.key] = p; });
  var keys = Object.keys(byKey).sort().reverse();
  var sel = document.getElementById(selectId);
  var opts = '<option value="alle">Alle Zeiträume</option>';
  keys.forEach(function(k){
    opts += '<option value="'+k+'">'+byKey[k].label+(k===todayP.key?' (aktuell)':'')+'</option>';
  });
  sel.innerHTML = opts;
  var remembered = uiFilters[selectId];
  sel.value = (remembered && (remembered==='alle' || keys.indexOf(remembered)>-1)) ? remembered : todayP.key;
}

function fillMonthFilter(selectId, dates){
  var months = Array.from(new Set(dates.map(monthKey))).sort().reverse();
  var sel = document.getElementById(selectId);
  var opts = '<option value="alle">Alle Monate</option>';
  months.forEach(function(mk){
    var parts = mk.split('-');
    opts += '<option value="'+mk+'">'+MONTH_NAMES[parseInt(parts[1],10)-1]+' '+parts[0]+'</option>';
  });
  sel.innerHTML = opts;
  var remembered = uiFilters[selectId];
  if (remembered && (remembered==='alle' || months.indexOf(remembered)>-1)){
    sel.value = remembered;
  } else {
    var curKey = todayISO().slice(0,7);
    if (months.indexOf(curKey)>-1) sel.value = curKey;
  }
}

    var zahlungsartCell = readOnly ? escapeHtml(a.zahlungsart||'–') : zahlungsartInlineSelect(a.id, 'zahlungsart', a.zahlungsart);
    var abgleichCell = abgleichBadge(a.id, !!a.abgeglichen);
    return '<tr><td class="num">'+a.datum+'</td><td>'+kategorieCell+'</td>'+
      '<td class="num">'+eur(a.betrag)+'</td><td class="num">'+satzCell+'</td>'+
      '<td>'+fixCell+'</td><td>'+zahlungsartCell+'</td>'+
      '<td class="nowrap">'+abgleichCell+'</td><td class="wrap">'+escapeHtml(a.notiz)+'</td>'+
      '<td>'+(readOnly?'':'<button class="del-btn" data-del-ausgabe="'+a.id+'" title="Löschen">✕</button>')+'</td></tr>';
  }).join('');
  tbody.querySelectorAll('.inline-edit').forEach(function(sel){
    sel.addEventListener('change', function(){
      var id = sel.getAttribute('data-editid');
      var field = sel.getAttribute('data-field');
      var a = state.ausgaben.filter(function(x){return x.id===id;})[0];
      if (a){ a[field] = (field==='ustSatz') ? Number(sel.value) : sel.value; persistAndRefresh('Gespeichert.'); }
    });
  });
  tbody.querySelectorAll('[data-toggle-abgleich]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-toggle-abgleich');
      var a = state.ausgaben.filter(function(x){return x.id===id;})[0];
      if (a){ a.abgeglichen = !a.abgeglichen; persistAndRefresh('Gespeichert.'); }
    });
  });
  tbody.querySelectorAll('[data-del-ausgabe]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-del-ausgabe');
      state.ausgaben = state.ausgaben.filter(function(a){return a.id!==id;});
      persistAndRefresh('Eintrag gelöscht.');
    });
  });
}

/* ============================= RENDER: FIXKOSTEN ============================= */
function renderFixkosten(){
  var html = '<div class="pagehead"><h1>Fixkosten</h1><p>Monatlich wiederkehrende Kosten – werden automatisch jeden Monat berücksichtigt</p></div>';

  if (!readOnly){
    html += '<div class="card"><h2>Neue Fixkosten-Position</h2>'+
      '<form id="form-fixkosten" class="form-row">'+
      '<div class="field grow"><label>Bezeichnung</label><input type="text" name="bezeichnung" placeholder="z. B. Miete Lilienthal" required></div>'+
      '<div class="field grow"><label>Kategorie</label><select name="kategorie">'+optionList(state.kostenkategorien)+'</select></div>'+
      '<div class="field"><label>Standort</label><select name="standort">'+optionList(['Allgemein'].concat(state.standorte))+'</select></div>'+
      '<div class="field"><label>Betrag / Monat (€, brutto)</label><input class="num-input" type="number" min="0" step="0.01" name="betrag" required></div>'+
      '<div class="field"><label>MwSt-Satz</label>'+ustSelect('ustSatz',19)+'</div>'+
      '<div class="field"><label>Abbuchungstag (optional)</label><input class="num-input" type="number" min="1" max="31" step="1" name="abbuchungstag" placeholder="z. B. 5" style="width:90px;"></div>'+
      '<div class="field"><label>Aktiv ab</label><input type="month" name="ab" value="'+todayISO().slice(0,7)+'" required></div>'+
      '<div class="field"><label>Aktiv bis (optional)</label><input type="month" name="bis"></div>'+
      '<button class="btn" type="submit">Hinzufügen</button>'+
      '</form>'+
      '<div class="cardsub" style="margin-top:2px;">Der Abbuchungstag ist der Tag im Monat, an dem die Position vom Konto abgebucht wird (falls bekannt) – hilfreich beim späteren Abgleich mit dem Kontoauszug.</div>'+
      '</div>';
  }

  var fixMonthOptions = [];
  (function(){
    var d = new Date(); d.setDate(1);
    for (var i=0;i<6;i++){
      var key = d.toISOString().slice(0,7);
      fixMonthOptions.push(key);
      d.setMonth(d.getMonth()-1);
    }
  })();

  html += '<div class="card"><h2>Aktuelle Fixkosten</h2><div class="cardsub">Summe pro Monat (brutto, aktive Positionen): <strong id="fix-summe"></strong></div>'+
    '<div class="cardsub" id="fix-summe-hinweis" style="margin-top:2px;"></div>'+
    '<div class="cardsub" style="margin-bottom:10px;">Abbuchung prüfen für: <select id="fix-abbuch-monat">'+
    fixMonthOptions.map(function(k){return '<option value="'+k+'">'+monthLabelDE(k)+'</option>';}).join('')+
    '</select></div>'+
    '<div class="table-wrap"><table id="tbl-fixkosten">'+
    '<thead><tr><th>Bezeichnung</th><th>Kategorie</th><th>Standort</th><th class="num">Betrag/Monat</th><th class="num">MwSt</th><th class="num">Abbuchungstag</th><th>Ab</th><th>Bis</th><th id="th-fix-abbuch">Abbuchung</th><th></th></tr></thead>'+
    '<tbody></tbody></table></div></div>';

  if (!readOnly){
    html += '<div class="card"><h2>Neue jährliche Rücklage</h2>'+
      '<form id="form-ruecklage" class="form-row">'+
      '<div class="field grow"><label>Bezeichnung</label><input type="text" name="bezeichnung" placeholder="z. B. Liegeplatzgebühren Boot 1 + 2" required></div>'+
      '<div class="field"><label>Standort</label><select name="standort">'+optionList(['Allgemein'].concat(state.standorte))+'</select></div>'+
      '<div class="field"><label>Tagessatz (€/Tag, brutto)</label><input class="num-input" type="number" min="0" step="0.01" name="tagessatz" required></div>'+
      '<div class="field"><label>Läuft seit</label><input type="date" name="seit" value="'+todayISO()+'" required></div>'+
      '<div class="field grow"><label>Notiz (optional)</label><input type="text" name="notiz" placeholder="z. B. Vertrag Hafenmeister, Fälligkeit jeweils im Januar"></div>'+
      '<button class="btn" type="submit">Hinzufügen</button>'+
      '</form>'+
      '</div>';
  }

  html += '<div class="card"><h2>Jährliche Rücklagen (z. B. Liegeplatz, Werft)</h2>'+
    '<div class="cardsub">Für Kosten, die nur 1× im Jahr abgerechnet werden, sich aber täglich "ansammeln" (z. B. Liegeplatzgebühren) – der aufgelaufene Betrag wird automatisch von „Wirklich frei verfügbar" auf der Übersichtsseite abgezogen, damit die Jahresrechnung nicht überrascht. Wenn die Rechnung tatsächlich bezahlt ist: als Ausgabe verbuchen wie gewohnt UND hier auf „✓ beglichen" klicken, damit die Rücklage wieder bei 0 € startet.</div>'+
    '<div class="table-wrap"><table id="tbl-ruecklagen">'+
    '<thead><tr><th>Bezeichnung</th><th>Standort</th><th class="num">Tagessatz</th><th>Läuft seit</th><th class="num">Tage</th><th class="num">Aufgelaufen</th><th>Notiz</th><th></th></tr></thead>'+
    '<tbody></tbody></table></div></div>';

  document.getElementById('panel-fixkosten').innerHTML = html;
  var fixAbbuchSel = document.getElementById('fix-abbuch-monat');
  var rememberedFixMonat = uiFilters['fix-abbuch-monat'];
  if (rememberedFixMonat && fixMonthOptions.indexOf(rememberedFixMonat)>-1) fixAbbuchSel.value = rememberedFixMonat;
  renderFixkostenTable();
  renderRuecklagenTable();
  fixAbbuchSel.addEventListener('change', function(){ rememberFilter('fix-abbuch-monat'); renderFixkostenTable(); });

  if (!readOnly){
    document.getElementById('form-fixkosten').addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(ev.target);
      state.fixkosten.push({
        id: uid(), bezeichnung: fd.get('bezeichnung'), kategorie: fd.get('kategorie'), standort: fd.get('standort'),
        betrag: Number(fd.get('betrag'))||0, ustSatz: Number(fd.get('ustSatz')),
        abbuchungstag: fd.get('abbuchungstag') ? Number(fd.get('abbuchungstag')) : null,
        ab: fd.get('ab'), bis: fd.get('bis')||''
      });
      persistAndRefresh('Fixkosten-Position gespeichert.');
      ev.target.reset();
      document.querySelector('#form-fixkosten input[name=ab]').value = todayISO().slice(0,7);
    });
    document.getElementById('form-ruecklage').addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(ev.target);
      state.ruecklagen.push({
        id: uid(), bezeichnung: fd.get('bezeichnung'), standort: fd.get('standort'),
        tagessatz: Number(fd.get('tagessatz'))||0, seit: fd.get('seit'), notiz: fd.get('notiz')||''
      });
      persistAndRefresh('Rücklage gespeichert.');
      ev.target.reset();
      document.querySelector('#form-ruecklage input[name=seit]').value = todayISO();
    });
  }
}

function renderRuecklagenTable(){
  var m = computeMetrics();
  var tbody = document.querySelector('#tbl-ruecklagen tbody');
  if (m.ruecklagenRows.length===0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Noch keine jährlichen Rücklagen hinterlegt.</td></tr>';
    return;
  }
  tbody.innerHTML = m.ruecklagenRows.slice().sort(function(a,b){return (a.bezeichnung||'').localeCompare(b.bezeichnung||'');}).map(function(r){
    return '<tr><td class="wrap">'+escapeHtml(r.bezeichnung)+'</td><td>'+escapeHtml(r.standort||'')+'</td>'+
      '<td class="num">'+eur(r.tagessatz)+'</td><td class="num">'+deDate(r.seit)+'</td><td class="num">'+r.tage+'</td>'+
      '<td class="num" style="color:var(--brass-ink); font-weight:600;">'+eur(r.betrag)+'</td>'+
      '<td class="wrap">'+escapeHtml(r.notiz)+'</td>'+
      '<td class="nowrap">'+(readOnly?'':
        '<input type="date" class="ruecklage-settle-date" data-rid="'+r.id+'" value="" style="width:120px;">'+
        ' <button class="btn-mini" data-settle-ruecklage="'+r.id+'" title="Jetzt beglichen – Rücklage ab diesem Datum neu berechnen">✓ beglichen</button>'+
        ' <button class="del-btn" data-del-ruecklage="'+r.id+'" title="Löschen">✕</button>')+

  tbody.querySelectorAll('[data-settle-ruecklage]').forEach(function(b){

      var input = tbody.querySelector('.ruecklage-settle-date[data-rid="'+id+'"]');
      var datum = (input && input.value) ? input.value : todayISO();
      var r = state.ruecklagen.filter(function(x){return x.id===id;})[0];
      if (r){ r.seit = datum; persistAndRefresh('Rücklage zurückgesetzt – Jahresrechnung als beglichen erfasst.'); }

  });
